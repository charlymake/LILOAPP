<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<!-- Chart.js removed — charts now render as inline SVG -->

<style>
/* ═══════════════════════════════
   TOKENS
═══════════════════════════════ */
:root {
  --aa:#C2185B; --aa-m:#FCE4EC;
  --cr:#D4511C; --cr-m:#FBE9E7;
  --li:#E8B84B; --li-m:#FEF9E7;
  --bg:#F4EEE8; --surface:#FFFFFF;
  --s2:#EBE5DF; --s3:#DDD5CC;
  --border:#D4CBC2;
  --t1:#2A1F1A; --t2:#7A6560; --t3:#B09A94;
  --ok:#2E7D32; --ok-bg:#E8F5E9;
  --warn:#B45309; --warn-bg:#FEF3C7;
  --danger:#C62828; --danger-bg:#FFEBEE;
  --r:14px; --rsm:9px; --rxs:5px;
  --sh:0 2px 10px rgba(42,31,26,.07);
  --shmd:0 4px 20px rgba(42,31,26,.10);
  --shlg:0 8px 40px rgba(42,31,26,.14);
  --tr:.15s ease;
  --font:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif;
  --serif:'Fraunces',Georgia,serif;
  --sidebar:220px; --topbar:56px; --btmnav:64px;
  --btn-bg:#2A1F1A; --btn-fg:#F0E8E4;
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#171210; --surface:#221A16; --s2:#2D2420; --s3:#3A2E28; --sb-bg:#100C0A; --btn-bg:#E8B84B; --btn-fg:#1A1310;
    --border:#4A3C34; --t1:#F0E8E4; --t2:#B8A49C; --t3:#7A6560;
    --aa-m:#3D0A1E; --cr-m:#3D1A08; --li-m:#3D2E00;
    --ok-bg:#1B3D1D; --warn-bg:#3D2D00; --danger-bg:#3D1414;
    --sh:0 2px 10px rgba(0,0,0,.28); --shmd:0 4px 20px rgba(0,0,0,.36); --shlg:0 8px 40px rgba(0,0,0,.48);
  }
}
:root[data-theme="dark"]{
  --bg:#171210; --surface:#221A16; --s2:#2D2420; --s3:#3A2E28; --sb-bg:#100C0A; --btn-bg:#E8B84B; --btn-fg:#1A1310;
  --border:#4A3C34; --t1:#F0E8E4; --t2:#B8A49C; --t3:#7A6560;
  --aa-m:#3D0A1E; --cr-m:#3D1A08; --li-m:#3D2E00;
  --ok-bg:#1B3D1D; --warn-bg:#3D2D00; --danger-bg:#3D1414;
  --sh:0 2px 10px rgba(0,0,0,.28); --shmd:0 4px 20px rgba(0,0,0,.36); --shlg:0 8px 40px rgba(0,0,0,.48);
}

/* ═══════════════════════════════
   RESET
═══════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}html:has(.login-screen){overflow:auto;}
body{background:var(--bg);color:var(--t1);font-family:var(--font);-webkit-font-smoothing:antialiased;font-size:15px;}
button{cursor:pointer;border:none;background:none;font-family:inherit;color:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
input,select,textarea{font-family:inherit;color:inherit;}
a{color:inherit;text-decoration:none;}
:focus-visible{outline:2px solid var(--li);outline-offset:2px;}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}

/* ═══════════════════════════════
   LAYOUT
═══════════════════════════════ */
#app{height:100vh;display:flex;overflow:hidden;position:relative;}

.sidebar{
  width:var(--sidebar);flex-shrink:0;height:100vh;
  background:var(--sb-bg,#2A1F1A);color:#F0E8E4;border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;z-index:20;
}
.sidebar-logo{padding:24px 20px 20px;border-bottom:1px solid rgba(255,255,255,.08);}
.logo-mark{font-family:'Pacifico',cursive;font-size:26px;font-weight:400;color:var(--li);}
.logo-sub{font-size:10px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:rgba(240,232,228,.45);margin-top:2px;}
.sidebar-user{padding:14px 20px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:10px;}
.s-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0;}
.s-name{font-size:13px;font-weight:500;color:#F0E8E4;}
.s-role{font-size:11px;color:rgba(240,232,228,.5);}
.sidebar-nav{flex:1;padding:12px 0;overflow-y:auto;}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:10px 20px;
  font-size:14px;font-weight:400;color:rgba(240,232,228,.65);
  transition:background var(--tr),color var(--tr);cursor:pointer;width:100%;text-align:left;
}
.nav-item:hover{background:rgba(255,255,255,.06);color:#F0E8E4;}
.nav-item.active{background:rgba(255,255,255,.10);color:#F0E8E4;font-weight:500;}
.sidebar-bottom{padding:16px 20px;border-top:1px solid rgba(255,255,255,.08);}
.btn-logout{
  width:100%;padding:9px 14px;border-radius:var(--rsm);
  font-size:13px;font-weight:500;color:rgba(240,232,228,.6);
  display:flex;align-items:center;gap:8px;transition:background var(--tr),color var(--tr);
}
.btn-logout:hover{background:rgba(255,255,255,.08);color:#F0E8E4;}

.main-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;}
.topbar{
  height:var(--topbar);min-height:var(--topbar);
  background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 20px;gap:12px;z-index:10;
}
.topbar-title{font-size:16px;font-weight:600;flex:1;}
.topbar-actions{display:flex;align-items:center;gap:8px;}
.view{flex:1;overflow-y:auto;overflow-x:hidden;padding:20px;}
.view::-webkit-scrollbar{width:6px;}
.view::-webkit-scrollbar-track{background:transparent;}
.view::-webkit-scrollbar-thumb{background:var(--s3);border-radius:3px;}

/* ═══════════════════════════════
   LOGIN & PIN
═══════════════════════════════ */
.login-screen{
  width:100%;min-height:100vh;min-height:-webkit-fill-available;display:flex;flex-direction:column;
  align-items:center;justify-content:center;background:var(--bg);gap:24px;padding:24px;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
}
.login-logo{font-family:'Pacifico',cursive;font-size:56px;font-weight:400;color:var(--li);line-height:1;text-shadow:0 2px 12px rgba(232,184,75,.25);}
.login-tagline{font-size:11px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--t3);margin-top:6px;text-align:center;}
.login-card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shmd);padding:28px;width:100%;max-width:360px;}
.login-hint{font-size:13px;color:var(--t2);text-align:center;margin-bottom:18px;font-weight:500;}
.user-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.user-btn{
  background:var(--s2);border:1.5px solid var(--border);
  border-radius:var(--rsm);padding:16px 10px;text-align:center;
  transition:border-color var(--tr),background var(--tr);
}
.user-btn:hover{border-color:var(--li);background:var(--li-m);}
.user-btn-name{display:block;font-size:14px;font-weight:600;color:var(--t1);}
.user-btn-role{display:block;font-size:11px;color:var(--t3);margin-top:3px;}

/* PIN pad */
.pin-header{text-align:center;margin-bottom:20px;}
.pin-who{font-size:18px;font-weight:600;font-family:var(--serif);}
.pin-sub{font-size:12px;color:var(--t3);margin-top:4px;}
.pin-dots{display:flex;gap:12px;justify-content:center;margin-bottom:20px;}
.pin-dot{
  width:16px;height:16px;border-radius:50%;
  border:2px solid var(--border);
  transition:background var(--tr),border-color var(--tr),transform .1s ease;
}
.pin-dot.filled{background:var(--t1);border-color:var(--t1);transform:scale(1.1);}
.pin-error{text-align:center;font-size:12px;color:var(--danger);height:18px;margin-bottom:8px;font-weight:500;}
.pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.pin-key{
  background:var(--s2);border-radius:var(--rsm);
  font-size:24px;font-weight:400;padding:18px 14px;
  min-height:60px;user-select:none;touch-action:manipulation;
  transition:background var(--tr),transform .08s ease;
  -webkit-tap-highlight-color:transparent;
}
.pin-key:hover{background:var(--s3);}
.pin-key:active{transform:scale(.91);background:var(--s3);}
.pin-key.invisible{visibility:hidden;pointer-events:none;}
.pin-key.del{font-size:18px;}
.pin-back{width:100%;margin-top:14px;padding:10px;font-size:12px;color:var(--t2);text-align:center;border-radius:var(--rxs);transition:color var(--tr);}
.pin-back:hover{color:var(--t1);}

/* ═══════════════════════════════
   POS
═══════════════════════════════ */
.pos-layout{flex:1;display:flex;overflow:hidden;}
.pos-left{flex:1;display:flex;flex-direction:column;overflow:hidden;border-right:1px solid var(--border);}
.pos-right{width:310px;flex-shrink:0;display:flex;flex-direction:column;background:var(--surface);}

.brand-tabs{display:flex;gap:4px;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto;flex-shrink:0;}
.brand-tabs::-webkit-scrollbar{display:none;}
.brand-tab{
  padding:7px 14px;border-radius:20px;font-size:13px;font-weight:500;white-space:nowrap;
  border:1.5px solid var(--border);color:var(--t2);transition:all var(--tr);
}
.brand-tab:hover{border-color:var(--t1);color:var(--t1);}
.brand-tab.active[data-brand="all"]{background:var(--btn-bg);border-color:var(--btn-bg);color:var(--btn-fg);}
.brand-tab.active[data-brand="amor_azucar"]{background:var(--aa);border-color:var(--aa);color:#fff;}
.brand-tab.active[data-brand="crepa_roll"]{background:var(--cr);border-color:var(--cr);color:#fff;}
.brand-tab.active[data-brand="lilo"]{background:var(--li);border-color:var(--li);color:#fff;}

.product-grid-wrap{flex:1;overflow-y:auto;padding:12px;}
.product-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;}
.product-card{
  background:var(--surface);border-radius:var(--rsm);
  border:1.5px solid var(--border);padding:14px 12px;cursor:pointer;min-height:96px;
  display:flex;flex-direction:column;gap:6px;
  transition:border-color var(--tr),box-shadow var(--tr),transform var(--tr);
  user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  position:relative;overflow:hidden;
}
.product-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--bc);}
.product-card:hover{border-color:var(--bc);box-shadow:var(--sh);}
.product-card:active{transform:scale(.96);}
.product-card.aa{--bc:var(--aa);}
.product-card.cr{--bc:var(--cr);}
.product-card.li{--bc:var(--li);}
.product-card.out{opacity:.45;pointer-events:none;}
.p-name{font-size:16px;font-weight:600;line-height:1.25;color:var(--t1);}
.p-price{font-size:20px;font-weight:800;margin-top:auto;color:var(--t1);font-variant-numeric:tabular-nums;}
.p-stock{font-size:12px;color:var(--t3);}
.p-stock.low{color:var(--warn);}
.p-stock.out{color:var(--danger);}

.cart-header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.cart-title{font-size:14px;font-weight:600;}
.cart-clear{font-size:12px;color:var(--t3);}
.cart-clear:hover{color:var(--danger);}
.cart-items{flex:1;overflow-y:auto;padding:6px;}
.cart-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--t3);gap:8px;padding:40px 0;}
.cart-empty-icon{font-size:36px;opacity:.4;}
.cart-empty-text{font-size:13px;}
.cart-item{display:flex;align-items:center;gap:8px;padding:8px;border-radius:var(--rsm);transition:background var(--tr);}
.cart-item:hover{background:var(--s2);}
.c-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.c-info{flex:1;min-width:0;}
.c-name{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.c-price{font-size:11px;color:var(--t3);font-variant-numeric:tabular-nums;}
.qty-ctrl{display:flex;align-items:center;gap:5px;flex-shrink:0;}
.qty-btn{
  width:26px;height:26px;border-radius:50%;background:var(--s2);
  font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;
  transition:background var(--tr);touch-action:manipulation;
}
.qty-btn:hover{background:var(--s3);}
.qty-num{font-size:13px;font-weight:600;min-width:16px;text-align:center;font-variant-numeric:tabular-nums;}
.cart-footer{padding:12px 16px 60px;border-top:1px solid var(--border);}
/* Ocultar badge Netlify para que no tape botones */
[data-netlify-toolbar],iframe[title*="Netlify"]{display:none!important;}
.cart-total-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
.cart-total-label{font-size:13px;color:var(--t2);}
.cart-total-amount{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;}
.btn-checkout{
  width:100%;padding:13px;border-radius:var(--rsm);
  background:var(--btn-bg);color:var(--btn-fg);font-size:15px;font-weight:600;
  transition:opacity var(--tr);touch-action:manipulation;
}
.btn-checkout:hover{opacity:.88;}
.btn-checkout:disabled{opacity:.35;pointer-events:none;}

/* ── MESAS ── */
.btn-abrir-mesa{
  width:100%;padding:11px;border-radius:var(--rsm);
  background:linear-gradient(135deg,#2E7D32,#388E3C);color:#fff;
  font-size:14px;font-weight:600;margin-bottom:8px;
  transition:opacity var(--tr);touch-action:manipulation;
}
.btn-abrir-mesa:hover{opacity:.88;}
.btn-abrir-mesa:disabled{opacity:.35;pointer-events:none;}
.mesas-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;padding:16px;}
.mesa-card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r);padding:14px;cursor:pointer;transition:box-shadow var(--tr),border-color var(--tr);position:relative;}
.mesa-card:hover{box-shadow:var(--shsm);border-color:var(--li);}
.mesa-card-name{font-size:16px;font-weight:700;margin-bottom:4px;}
.mesa-card-time{font-size:11px;color:var(--t3);margin-bottom:8px;}
.mesa-card-total{font-size:18px;font-weight:700;color:var(--li);font-variant-numeric:tabular-nums;}
.mesa-card-items{font-size:11px;color:var(--t2);margin-top:2px;}
.mesa-badge{display:inline-flex;align-items:center;justify-content:center;background:var(--aa);color:#fff;border-radius:50%;width:18px;height:18px;font-size:10px;font-weight:700;margin-left:5px;vertical-align:middle;}
.mesa-detalle-header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border);}
.mesa-detalle-name{font-size:20px;font-weight:700;flex:1;}
.mesa-detalle-time{font-size:12px;color:var(--t3);}
.mesa-items-list{flex:1;overflow-y:auto;padding:12px 16px;}
.mesa-item-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--s2);}
.mesa-item-name{flex:1;font-size:13px;font-weight:500;}
.mesa-item-price{font-size:13px;color:var(--t2);min-width:60px;text-align:right;}
.mesa-detalle-footer{padding:12px 16px 60px;border-top:1px solid var(--border);}
.mesa-total-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;}
.btn-cobrar-mesa{width:100%;padding:13px;border-radius:var(--rsm);background:var(--btn-bg);color:var(--btn-fg);font-size:15px;font-weight:600;transition:opacity var(--tr);}
.btn-cobrar-mesa:hover{opacity:.88;}
.modal-mesa-nombres{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:8px 0 16px;}
.btn-mesa-nombre{padding:12px 20px;border-radius:var(--rsm);border:2px solid var(--border);font-size:15px;font-weight:600;background:var(--s2);transition:all .15s;}
.btn-mesa-nombre:hover,.btn-mesa-nombre.active{border-color:var(--li);background:rgba(var(--li-rgb,.2));color:var(--li);}
@media(min-width:541px) and (max-width:1100px){.mesas-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));}}
@media(max-width:540px){.mesas-grid{grid-template-columns:repeat(2,1fr);}}

/* Cart FAB mobile */
.cart-fab{
  display:none;position:fixed;bottom:calc(72px + env(safe-area-inset-bottom));right:16px;z-index:50;
  background:var(--btn-bg);color:var(--btn-fg);border-radius:50px;
  padding:13px 20px;font-size:14px;font-weight:600;
  box-shadow:var(--shlg);align-items:center;gap:8px;
  animation:pop-in .18s ease;touch-action:manipulation;
}
/* Tablet portrait: cart always visible, narrower */
@media(min-width:541px) and (max-width:1100px){
  .pos-right{width:248px;}
  .cart-footer{padding-bottom:16px!important;}
  .product-grid{grid-template-columns:repeat(4,minmax(0,1fr))!important;}
}
@media(max-width:540px){.product-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;}}
/* Phone only: hide cart panel, show FAB */
@media(max-width:540px){.cart-fab{display:flex;} .pos-right{display:none;}}

/* Bottom nav */
.bottom-nav{height:var(--btmnav);min-height:var(--btmnav);background:var(--surface);border-top:1px solid var(--border);display:flex;z-index:20;}
.bnav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:500;color:var(--t3);transition:color var(--tr);cursor:pointer;touch-action:manipulation;}
.bnav-item.active{color:var(--li);}
.bnav-icon{font-size:21px;}

/* ═══════════════════════════════
   DASHBOARD
═══════════════════════════════ */
.dash-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px;}
.dash-title{font-family:var(--serif);font-size:22px;font-weight:700;}
.date-tabs{display:flex;background:var(--s2);border-radius:var(--rsm);padding:3px;gap:2px;}
.date-tab{padding:6px 14px;border-radius:6px;font-size:12px;font-weight:500;color:var(--t2);transition:background var(--tr),color var(--tr);}
.date-tab.active{background:var(--surface);color:var(--t1);box-shadow:var(--sh);}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px;}
.stat-card{background:var(--surface);border-radius:var(--r);padding:18px;border:1.5px solid var(--border);}
.stat-label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.stat-dot{width:8px;height:8px;border-radius:50%;}
.stat-amount{font-size:26px;font-weight:700;font-family:var(--serif);letter-spacing:-.5px;font-variant-numeric:tabular-nums;}
.stat-sub{font-size:11px;color:var(--t3);margin-top:4px;}
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;}
@media(max-width:700px){.charts-grid{grid-template-columns:1fr;}}

/* ── MOBILE SIDEBAR ── */
.hamburger-btn{display:none;align-items:center;justify-content:center;width:36px;height:36px;border-radius:var(--rxs);font-size:20px;line-height:1;color:var(--t1);background:var(--s2);flex-shrink:0;transition:background var(--tr);}
.hamburger-btn:hover{background:var(--s3);}
.sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(42,31,26,.45);z-index:99;-webkit-tap-highlight-color:transparent;}
@media(max-width:900px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);transition:transform .25s cubic-bezier(.4,0,.2,1);z-index:100;overflow-y:auto;}
  .sidebar.mob-open{transform:translateX(0);}
  .sidebar-backdrop{display:block;opacity:0;pointer-events:none;transition:opacity .25s;}
  .sidebar-backdrop.mob-open{opacity:1;pointer-events:auto;}
  .hamburger-btn{display:flex!important;}
  .stat-grid{grid-template-columns:1fr 1fr!important;gap:8px!important;}
  .stat-card{padding:12px!important;}
  .stat-amount{font-size:20px!important;}
  .view{padding:12px!important;}
  .topbar{padding:0 12px!important;gap:8px!important;}
  .section-header{flex-wrap:wrap;gap:6px;}
  .table-wrap{overflow-x:auto;}
}
.chart-card{background:var(--surface);border-radius:var(--r);padding:18px;border:1.5px solid var(--border);}
.chart-title{font-size:13px;font-weight:600;margin-bottom:16px;}

class FsCollection{
  constructor(n){this._n=n;}
  _col(){return _fs.collection(this._n);}
  _doc(s){return s.exists?{...s.data(),id:s.id}:null;}
  _docs(s){return s.docs.map(d=>({...d.data(),id:d.id}));}
  async toArray(){return this._docs(await this._col().get());}
  async get(id){return this._doc(await this._col().doc(String(id)).get());}
  async add(data){const r=await this._col().add(data);return r.id;}
  async delete(id){await this._col().doc(String(id)).delete();}
  async count(){return(await this._col().get()).size;}
  async bulkAdd(arr){const b=_fs.batch();arr.forEach(d=>b.set(this._col().doc(),d));await b.commit();}
  filter(fn){return{toArray:async()=>(await this.toArray()).filter(fn)};}
  orderBy(field){
    const col=this._col(),self=this;
    return{
      reverse:()=>({toArray:async()=>self._docs(await col.orderBy(field,'desc').get())}),
      toArray:async()=>self._docs(await col.orderBy(field).get())
    };
  }
  where(field){
    const col=this._col(),self=this;
    return{
      equals:(val)=>{
        if(field==='id'){
          const ref=col.doc(String(val));
          return{
            toArray:async()=>{const d=await ref.get();return d.exists?[{...d.data(),id:d.id}]:[];},
            delete:async()=>ref.delete(),
            modify:async(upd)=>{
              const d=await ref.get();if(!d.exists)return;
              if(typeof upd==='function'){const o={...d.data(),id:d.id};upd(o);const{id,...rest}=o;await ref.update(rest);}
              else{await ref.update(upd);}
            }
          };
        }
        const q=col.where(field,'==',val);
        return{
          toArray:async()=>self._docs(await q.get()),
          filter:(fn)=>({toArray:async()=>(await self._docs(await q.get())).filter(fn)}),
          delete:async()=>{const s=await q.get();const b=_fs.batch();s.docs.forEach(d=>b.delete(d.ref));await b.commit();},
          modify:async(upd)=>{
            const s=await q.get();const b=_fs.batch();
            for(const d of s.docs){
              if(typeof upd==='function'){const o={...d.data(),id:d.id};upd(o);const{id,...rest}=o;b.update(d.ref,rest);}
              else{b.update(d.ref,upd);}
            }
            await b.commit();
          }
        };
      },
      between:(lo,hi,iLo,iHi)=>({
        toArray:async()=>{
          const q2=col.where(field,iLo?'>=':'>',lo).where(field,iHi?'<=':'<',hi).orderBy(field);
          return self._docs(await q2.get());
        }
      }),
      anyOf:(arr)=>({
        toArray:async()=>{
          if(!arr.length)return[];
          const chunks=[];for(let i=0;i<arr.length;i+=30)chunks.push(arr.slice(i,i+30));
          const res=await Promise.all(chunks.map(c=>col.where(field,'in',c.map(String)).get().then(s=>self._docs(s))));
          return res.flat();
        }
      })
    };
  }
}

const fmtN = n => Number(n||0).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',');
const esc  = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function fmtTime(ts){return new Date(ts).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit',hour12:false});}
function fmtDate(ts){return new Date(ts).toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'});}
function fmtDateShort(ts){return new Date(ts).toLocaleDateString('es-MX',{day:'2-digit',month:'short'});}
function dayStart(d=0){const x=new Date();x.setHours(0,0,0,0);x.setDate(x.getDate()-d);return x.getTime();}
function dayEnd(d=0){return dayStart(d)+86400000-1;}
function getRangeTs(){
  const n=Date.now();
  if(S.dateRange==='today')return{from:dayStart(),to:n};
  if(S.dateRange==='week')return{from:dayStart(6),to:n};
  if(S.dateRange==='month')return{from:dayStart(29),to:n};
  if(S.dateRange==='day'&&S.customDay){
    const f=new Date(S.customDay+'T00:00:00').getTime();
    return{from:f,to:f+86399999};
  }
  if(S.dateRange==='custom'&&S.customFrom&&S.customTo){
    const f=new Date(S.customFrom+'T00:00:00').getTime();
    const t=new Date(S.customTo+'T23:59:59').getTime();
    return{from:Math.min(f,t),to:Math.max(f,t)};
  }
  return{from:dayStart(),to:n};
}

async function recordSale(method,cashReceived,discountAmount=0,payDetails=null){
  const items=S.cart;
  const subtotal=items.reduce((s,i)=>s+i.price*i.qty,0);
  const total=subtotal-discountAmount;
  const bt={};items.forEach(i=>{bt[i.brand]=(bt[i.brand]||0)+i.price*i.qty;});
  const saleId=await db.sales.add({
    timestamp:Date.now(),total,subtotal,discount:discountAmount,payment_method:method,
    cash_received:cashReceived||null,
    change:cashReceived?cashReceived-total:null,
    payment_details:payDetails?JSON.stringify(payDetails):null,
    employee_id:S.user.id,employee_name:S.user.name,
    shift_id:S.shift?.id||null,
    brand_totals:JSON.stringify(bt),
    items_json:JSON.stringify(items.map(i=>({id:i.id,name:i.name,brand:i.brand,qty:i.qty,price:i.price})))
  });
  try{S.popularity=S.popularity||{};items.forEach(i=>{const k=i.id!=null?'i:'+i.id:'n:'+i.name;S.popularity[k]=(S.popularity[k]||0)+(i.qty||0);});}catch(_){}
  for(const item of items){
    await db.sale_items.add({sale_id:saleId,product_id:item.id,product_name:item.name,brand:item.brand,quantity:item.qty,unit_price:item.price,subtotal:item.price*item.qty});
    if(item.track_stock&&item.stock<9999)
      await db.products.where('id').equals(item.id).modify(p=>{p.stock=Math.max(0,p.stock-item.qty);});
  }
  S.cart=[];
  S.products=await db.products.filter(p=>p.active===1).toArray();
}

/* ── Cierre automático de turnos de días anteriores ── */
async function _liloAutoCloseStale(){
  try{
    const n=new Date();
    const todayStart=new Date(n.getFullYear(),n.getMonth(),n.getDate()).getTime();
    const all=await db.shifts.toArray();
    const stale=all.filter(sh=>sh.status==='open'&&(sh.start_time||0)<todayStart);
    for(const sh of stale){
      const st=new Date(sh.start_time);
      const midnight=new Date(st.getFullYear(),st.getMonth(),st.getDate()+1).getTime()-1000; // 23:59:59 del día en que abrió
      await db.shifts.where('id').equals(sh.id).modify({end_time:midnight,status:'closed',auto_closed:1});
      if(S.shift&&S.shift.id===sh.id)S.shift=null;
    }
    return stale.length;
  }catch(e){console.warn('Auto-cierre de turnos:',e);return 0;}
}

async function closeShift(){
  if(!S.shift)return null;
  await db.shifts.where('id').equals(S.shift.id).modify({end_time:Date.now(),status:'closed',cash_close:S.cashClose||0});
  const allShiftSales=await db.sales.where('shift_id').equals(S.shift.id).toArray();
  const sales=allShiftSales.filter(x=>x.status!=='cancelled'); // no contar canceladas
  const total=sales.reduce((s,x)=>s+(x.total||0),0);
  const bt={amor_azucar:0,crepa_roll:0,lilo:0};
  const pt={cash:0,card:0,transfer:0};
  sales.forEach(s=>{
    try{const b=JSON.parse(s.brand_totals||'{}');Object.keys(b).forEach(k=>{bt[k]=(bt[k]||0)+b[k];});}catch(_){}
    // pagos mixtos: repartir entre sus métodos
    if(s.payment_details){try{const pd=JSON.parse(s.payment_details);Object.keys(pd).forEach(k=>{pt[k]=(pt[k]||0)+(pd[k]||0);});return;}catch(_){}}
    pt[s.payment_method]=(pt[s.payment_method]||0)+(s.total||0);
  });
  const fondo=S.shift.fondo_caja||0;
  const cashInRegister=fondo+pt.cash;
  S.shift=null;
  return{total,count:sales.length,brandTotals:bt,payTotals:pt,fondo,cashInRegister};
}

async function loadDashboardData(){
  const{from,to}=getRangeTs();
  const rawSales=await db.sales.where('timestamp').between(from,to,true,true).toArray();
  const allSales=rawSales.filter(s=>s.status!=='cancelled');
  const total=allSales.reduce((s,x)=>s+(x.total||0),0);
  const bt={amor_azucar:0,crepa_roll:0,lilo:0};
  const pt={cash:0,card:0,transfer:0};
  const bp={}; // marca × forma de pago
  allSales.forEach(s=>{
    try{
      const b=JSON.parse(s.brand_totals||'{}');const bsum=Object.values(b).reduce((a,v)=>a+(v||0),0)||0;
      let split={};
      if(s.payment_details){try{const pd=JSON.parse(s.payment_details);const ps=Object.values(pd).reduce((a,v)=>a+(v||0),0)||1;Object.keys(pd).forEach(m=>split[m]=(pd[m]||0)/ps);}catch(_){}}
      if(!Object.keys(split).length)split[s.payment_method]=1;
      if(bsum>0)Object.keys(b).forEach(k=>{const share=(b[k]||0)/bsum*(s.total||0);bp[k]=bp[k]||{cash:0,card:0,transfer:0};Object.keys(split).forEach(m=>{bp[k][m]=(bp[k][m]||0)+share*split[m];});});
    }catch(_){}
    try{const b=JSON.parse(s.brand_totals||'{}');Object.keys(b).forEach(k=>{bt[k]=(bt[k]||0)+b[k];});}catch(_){}
    if(s.payment_details){try{const pd=JSON.parse(s.payment_details);Object.keys(pd).forEach(k=>{pt[k]=(pt[k]||0)+pd[k];});}catch(_){}}
    else{pt[s.payment_method]=(pt[s.payment_method]||0)+(s.total||0);}
  });
  let labels=[],aa=[],cr=[],li=[];
  if(S.dateRange==='today'){
    for(let h=6;h<=22;h++){
      const hs=dayStart()+h*3600000,he=hs+3600000;
      const hs2=allSales.filter(s=>s.timestamp>=hs&&s.timestamp<he);
      let a=0,b=0,c=0;
      hs2.forEach(s=>{try{const bx=JSON.parse(s.brand_totals||'{}');a+=bx.amor_azucar||0;b+=bx.crepa_roll||0;c+=bx.lilo||0;}catch(_){}});
      labels.push(h+'h');aa.push(a);cr.push(b);li.push(c);
    }
  } else if(S.dateRange==='day'&&S.customDay){
    const dayMs=new Date(S.customDay+'T00:00:00').getTime();
    for(let h=6;h<=22;h++){
      const hs=dayMs+h*3600000,he=hs+3600000;
      const hs2=allSales.filter(s=>s.timestamp>=hs&&s.timestamp<he);
      let a=0,b=0,c=0;
      hs2.forEach(s=>{try{const bx=JSON.parse(s.brand_totals||'{}');a+=bx.amor_azucar||0;b+=bx.crepa_roll||0;c+=bx.lilo||0;}catch(_){}});
      labels.push(h+'h');aa.push(a);cr.push(b);li.push(c);
    }
  } else if(S.dateRange==='custom'&&S.customFrom&&S.customTo){
    const f=new Date(S.customFrom+'T00:00:00').getTime();
    const t=new Date(S.customTo+'T23:59:59').getTime();
    const startMs=Math.min(f,t), endMs=Math.max(f,t);
    const msDay=86400000;
    const singleDay=Math.round((endMs-startMs)/msDay)===0;
    if(singleDay){
      // Same date → hourly bars like "Hoy"
      for(let h=6;h<=22;h++){
        const hs=startMs+h*3600000,he=hs+3600000;
        const hs2=allSales.filter(s=>s.timestamp>=hs&&s.timestamp<he);
        let a=0,b=0,c=0;
        hs2.forEach(s=>{try{const bx=JSON.parse(s.brand_totals||'{}');a+=bx.amor_azucar||0;b+=bx.crepa_roll||0;c+=bx.lilo||0;}catch(_){}});
        labels.push(h+'h');aa.push(a);cr.push(b);li.push(c);
      }
    } else {
      const totalDays=Math.round((endMs-startMs)/msDay)+1;
      for(let d=0;d<totalDays;d++){
        const ds=startMs+d*msDay, de=Math.min(ds+msDay-1,endMs);
        const ds2=allSales.filter(s=>s.timestamp>=ds&&s.timestamp<=de);
        let a=0,b=0,c=0;
        ds2.forEach(s=>{try{const bx=JSON.parse(s.brand_totals||'{}');a+=bx.amor_azucar||0;b+=bx.crepa_roll||0;c+=bx.lilo||0;}catch(_){}});
        labels.push(fmtDateShort(ds));aa.push(a);cr.push(b);li.push(c);
      }
    }
  } else {
    const days=S.dateRange==='week'?7:30;
    for(let d=days-1;d>=0;d--){
      const ds=dayStart(d),de=dayEnd(d);
      const ds2=allSales.filter(s=>s.timestamp>=ds&&s.timestamp<=de);
      let a=0,b=0,c=0;
      ds2.forEach(s=>{try{const bx=JSON.parse(s.brand_totals||'{}');a+=bx.amor_azucar||0;b+=bx.crepa_roll||0;c+=bx.lilo||0;}catch(_){}});
      labels.push(fmtDateShort(ds));aa.push(a);cr.push(b);li.push(c);
    }
  }
  const pm={};
  allSales.forEach(s=>{
    try{JSON.parse(s.items_json||'[]').forEach(i=>{pm[i.name]=pm[i.name]||{name:i.name,brand:i.brand,qty:0,total:0};pm[i.name].qty+=i.qty;pm[i.name].total+=i.price*i.qty;});}catch(_){}
  });
  const top=Object.values(pm).sort((a,b)=>b.total-a.total); // sin límite para que el detalle de categoría muestre todos
  // rawSales includes cancelled (for visual display); allSales excludes them (for totals/charts)
  const recentRaw=rawSales.slice().sort((a,b)=>b.timestamp-a.timestamp);
  let mesasAll=[];try{mesasAll=await db.mesas.toArray();}catch(_){}
  const mesasClosed=mesasAll.filter(m=>m.status==='cerrada'&&m.abierta_at&&m.cerrada_at&&m.cerrada_at>=from&&m.cerrada_at<=to&&m.cerrada_at>m.abierta_at);
  const mesasOpen=mesasAll.filter(m=>m.status==='abierta'&&m.abierta_at);
    return{brandPay:bp,mesas:{closed:mesasClosed,open:mesasOpen},total,brandTotals:bt,payTotals:pt,chart:{labels,aa,cr,li},topProducts:top,salesCount:allSales.length,cancelledCount:rawSales.length-allSales.length,sales:recentRaw};
}

function _liloCartKey(uid){return 'lilo_cart_'+uid;}
function _liloSaveCart(){
  try{
    if(!S.user||S._saving)return;
    const k=_liloCartKey(S.user.id);
    if(S.cart&&S.cart.length)localStorage.setItem(k,JSON.stringify({cart:S.cart,disc:S.appliedDiscount||null,t:Date.now()}));
    else localStorage.removeItem(k);
  }catch(_){}
}
function _liloRestoreCart(){
  try{
    if(!S.user)return;
    const v=JSON.parse(localStorage.getItem(_liloCartKey(S.user.id))||'null');
    if(v&&Array.isArray(v.cart)&&v.cart.length&&Date.now()-(v.t||0)<12*3600000){S.cart=v.cart;S.appliedDiscount=v.disc||null;}
  }catch(_){}
}

function renderTopbar(){
  const isAdmin=S.user?.role==='owner';
  const titles={pos:'Barra',dashboard:'Dashboard',inventory:'Inventario',products:'Menú',discounts:'Descuentos',users:'Usuarios',gastos:'Gastos',history:'Historial','shift-close':'Cerrar Turno','abrir-corte':'Abrir Corte',mesas:'Mesas Abiertas','mesa-detail':'Detalle de Mesa'};
  return`
  <div class="topbar">
    ${isAdmin?`<button class="hamburger-btn" onclick="window._liloToggleSidebar()" aria-label="Menú">☰</button>`:''}
    <div class="topbar-title">${titles[S.view]||'LILO'}</div>
    <div class="topbar-actions">
      ${S.shift?`<span style="font-size:12px;color:var(--ok);font-weight:500;">● Turno activo</span>`:''}
      <button class="btn-icon" data-action="switch-user" title="Volver a selección de usuario">↩ Cambiar usuario</button>
    </div>
  </div>`;
}

function renderBottomNav(){
  const items=S.shift
    ?[{v:'pos',icon:'🏪',label:'Caja'},{v:'mesas',icon:'🪑',label:'Mesas',badge:()=>S.mesasAbiertas.length||0},{v:'shift-close',icon:'🔒',label:'Cerrar Corte'}]
    :[{v:'pos',icon:'🏪',label:'Caja'},{v:'mesas',icon:'🪑',label:'Mesas',badge:()=>S.mesasAbiertas.length||0},{v:'abrir-corte',icon:'🏪',label:'Abrir Corte'}];
  return`
  <div class="bottom-nav">
    ${items.map(i=>{const bc=i.badge?i.badge():0;return`<button class="bnav-item ${S.view===i.v||S.view===i.v+'-detail'?'active':''}" data-action="navigate" data-view="${i.v}" style="position:relative;"><span class="bnav-icon" style="position:relative;display:inline-block;">${i.icon}${bc>0?`<span style="position:absolute;top:-6px;right:-12px;background:var(--aa);color:#fff;border-radius:50%;width:18px;height:18px;font-size:11px;font-weight:700;border:2px solid var(--surface);box-sizing:content-box;display:inline-flex;align-items:center;justify-content:center;">${bc}</span>`:''}</span><span>${i.label}</span></button>`;}).join('')}
  </div>`;
}

function _liloIsSistema(u){return (u?.name||'').trim().toLowerCase()==='sistema';}
function renderUserSelect(){
  return`
  <p class="login-hint">¿Quién está trabajando hoy?</p>
  <div class="user-grid">
    ${S.users.filter(u=>!_liloIsSistema(u)).map(u=>`
      <button class="user-btn" data-action="select-user" data-id="${u.id}">
        <span class="user-btn-name">${esc(u.name)}</span>
        <span class="user-btn-role">${ROLE_LABEL[u.role]||u.role}</span>
      </button>`).join('')}
  </div>`;
}

function renderPINPad(){
  const dots=[0,1,2,3].map(i=>`<div class="pin-dot${S.pinBuffer.length>i?' filled':''}"></div>`).join('');
  const keys=[1,2,3,4,5,6,7,8,9,'','0','⌫'];
  return`
  <div class="pin-header">
    <div class="pin-who">${esc(S.loginUser.name)}</div>
    <div class="pin-sub">${ROLE_LABEL[S.loginUser.role]||S.loginUser.role} · Ingresa tu PIN</div>
  </div>
  <div class="pin-dots">${dots}</div>
  <div class="pin-error" id="pin-error"></div>
  <div class="pin-grid">
    ${keys.map(k=>{
      if(k==='')return`<button class="pin-key invisible" disabled></button>`;
      if(k==='⌫')return`<button class="pin-key del" onclick="pinKey('back')">⌫</button>`;
      return`<button class="pin-key" onclick="pinKey('${k}')">${k}</button>`;
    }).join('')}
  </div>
  <button class="pin-back" onclick="pinBack()">← Cambiar usuario</button>`;
}

/* PIN global functions — called directly via onclick */
window.pinKey = function(k){
  if(k==='back'){
    S.pinBuffer=S.pinBuffer.slice(0,-1);
  } else if(S.pinBuffer.length<4){
    S.pinBuffer+=k;
  }
  document.querySelectorAll('.pin-dot').forEach((dot,i)=>{
    dot.classList.toggle('filled', i<S.pinBuffer.length);
  });
  if(S.pinBuffer.length===4){
    if(S.pinBuffer===S.loginUser.pin){
      doLogin(S.loginUser);
    } else {
      S.pinBuffer='';
      setTimeout(()=>{
        document.querySelectorAll('.pin-dot').forEach(d=>d.classList.remove('filled'));
        const el=document.getElementById('pin-error');
        if(el){el.textContent='PIN incorrecto ✕';setTimeout(()=>{if(el)el.textContent='';},2000);}
      },80);
    }
  }
};
window.pinBack = function(){
  S.loginUser=null;S.pinBuffer='';render(renderLogin());
};

  return`

/* ── Más vendidos primero (últimos 30 días) ── */
function _liloPopKey(p){return p.id!=null?'i:'+p.id:'n:'+(p.name||'');}
async function _liloLoadPopularity(){
  try{
    const n=new Date();const from=new Date(n.getFullYear(),n.getMonth(),n.getDate()-29).getTime();
    const sales=await db.sales.where('timestamp').between(from,Date.now()+60000,true,true).toArray();
    const pop={};
    sales.forEach(x=>{if(x.status==='cancelled')return;try{JSON.parse(x.items_json||'[]').forEach(i=>{const k=i.id!=null?'i:'+i.id:'n:'+i.name;pop[k]=(pop[k]||0)+(i.qty||0);});}catch(_){}});
    S.popularity=pop;
    if(S.user&&S.view==='pos'&&!S.modal){const grid=document.querySelector('.product-grid');if(grid&&!S.searchQuery)render(renderShell(renderPOS()));}
  }catch(e){console.warn('popularidad',e);}
}
function _liloByPopularity(list){
  const pop=S.popularity||{};
  return list.map((p,i)=>({p,i,v:pop[_liloPopKey(p)]||pop['n:'+(p.name||'')]||0})).sort((a,b)=>(b.v-a.v)||(a.i-b.i)).map(x=>x.p);
}
function renderProductCards(list){
  list=_liloByPopularity(list);
  return list.map(p=>{
    const low=p.track_stock&&p.stock>0&&p.stock<=5;
    const out=p.track_stock&&p.stock===0;
    const b=BRANDS[p.brand];
    return`<button class="product-card ${b?.cls||''}${out?' out':''}" data-action="add-to-cart" data-id="${p.id}"${out?' disabled':''}>
      <span class="p-name">${esc(p.name)}</span>
      <span class="p-price">${fmt(p.price)}</span>
      ${p.track_stock?`<span class="p-stock${out?' out':low?' low':''}">${out?'Agotado':low?p.stock+' restantes':'En stock'}</span>`:''}
    </button>`;
  }).join('');
}

function renderPOS(){
  let filtered=S.brandFilter==='all'?S.products:S.products.filter(p=>p.brand===S.brandFilter);
  if(S.searchQuery){const q=S.searchQuery.toLowerCase();filtered=filtered.filter(p=>p.name.toLowerCase().includes(q));}
  const cartTotal=S.cart.reduce((s,i)=>s+i.price*i.qty,0);
  const discount=calcDiscount(cartTotal);
  const finalTotal=cartTotal-discount;
  const cartCount=S.cart.reduce((s,i)=>s+i.qty,0);
  return`
  <div class="pos-layout">
    <div class="pos-left">
      <div class="brand-tabs">
        ${[{b:'all',label:'Todos',icon:'🍽️'},...Object.entries(BRANDS).map(([b,v])=>({b,label:v.name,icon:v.icon}))].map(({b,label,icon})=>`
          <button class="brand-tab${S.brandFilter===b?' active':''}" data-action="filter-brand" data-brand="${b}">${icon} ${label}</button>`).join('')}
        <button onclick="window._liloGasto()" style="margin-left:auto;flex-shrink:0;display:flex;align-items:center;gap:6px;border:2px solid #E8682A;color:#E8682A;background:rgba(232,104,42,.1);border-radius:50px;padding:6px 14px;font-size:13px;font-weight:700;font-family:var(--font);cursor:pointer;white-space:nowrap;">Registrar gasto</button>
      </div>
      <div style="padding:8px 12px 0;flex-shrink:0;">
        <input class="form-input" type="search" placeholder="🔍 Buscar producto…" value="${esc(S.searchQuery)}" data-action="search-products" style="width:100%;font-size:13px;padding:8px 12px;">
      </div>
      <div class="product-grid-wrap">
        <div class="product-grid">
          ${filtered.length===0?`<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon">📦</div><div class="empty-text">Sin productos</div></div>`:''}
          ${renderProductCards(filtered)}
        </div>
      </div>
    </div>
    <div class="pos-right">
      <div class="cart-header">
        <span class="cart-title">Orden ${cartCount>0?`(${cartCount})`:'—'}</span>
        ${cartCount>0?`<button class="cart-clear" data-action="clear-cart">Limpiar</button>`:''}
      </div>
      <div class="cart-items">
        ${S.cart.length===0?`<div class="cart-empty"><span class="cart-empty-icon">🛒</span><span class="cart-empty-text">Agrega productos</span></div>`:
          S.cart.map(item=>`
          <div class="cart-item">
            <div class="c-dot" style="background:${BRANDS[item.brand]?.hex||'#999'}"></div>
            <div class="c-info">
              <div class="c-name">${esc(item.name)}</div>
              <div class="c-price">${fmt(item.price)} · total ${fmt(item.price*item.qty)}</div>
            </div>
            <div class="qty-ctrl">
              <button class="qty-btn" data-action="qty-dec" data-id="${item.id}">−</button>
              <span class="qty-num">${item.qty}</span>
              <button class="qty-btn" data-action="qty-inc" data-id="${item.id}">+</button>
            </div>
          </div>`).join('')}
      </div>
      <div class="cart-footer">
        ${discount>0?`<div class="applied-discount-row"><span>🏷️ ${esc(S.appliedDiscount?.name||'Descuento')}</span><span>−${fmt(discount)}</span></div>`:''}
        <div class="cart-total-row">
          <span class="cart-total-label">${discount>0?'<span style="font-size:11px;text-decoration:line-through;color:var(--t3);">'+fmt(cartTotal)+'</span> Total':'Total'}</span>
          <span class="cart-total-amount">${fmt(finalTotal)}</span>
        </div>
        <div style="display:flex;gap:6px;margin-bottom:8px;">
          <button class="btn-secondary" style="flex:1;padding:8px;font-size:12px;" data-action="open-discount-picker">🏷️ Descuento</button>
          ${S.appliedDiscount?`<button class="btn-secondary" style="padding:8px 10px;font-size:12px;color:var(--danger);" data-action="remove-discount">✕</button>`:''}
        </div>
        <button class="btn-checkout" data-action="open-checkout"${S.cart.length===0?' disabled':''}>
          Cobrar ${cartCount>0?fmt(finalTotal):''}
        </button>
        <button class="btn-abrir-mesa" data-action="open-abrir-mesa-modal"${S.cart.length===0?' disabled':''}>
          🪑 Abrir Mesa
        </button>
      </div>
    </div>
  </div>
  ${S.cart.length>0?`<button class="cart-fab" data-action="open-checkout">🛒 ${cartCount} — ${fmt(finalTotal)}</button>`:''}`;
}

function mesaElapsed(ts){
  if(!ts)return'';
  const mins=Math.floor((Date.now()-ts)/60000);
  if(mins<60)return mins+'min';
  return Math.floor(mins/60)+'h '+(mins%60)+'min';
}

function renderMesas(){
  const mesas=S.mesasAbiertas;
  const isLibni=S.user?.name==='Libni';
  const sel=S.mesasSeleccionadas||[];
  return`
  <div style="display:flex;flex-direction:column;height:100%;overflow:hidden;">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;border-bottom:1px solid var(--border);">
      <div>
        <div style="font-size:18px;font-weight:700;">🪑 Mesas Abiertas</div>
        <div style="font-size:12px;color:var(--t3);">${mesas.length===0?'Sin mesas abiertas':mesas.length+' mesa'+(mesas.length!==1?'s':'')+' activa'+(mesas.length!==1?'s':'')}</div>
      </div>
      ${isLibni&&mesas.length>0?`
        <div style="display:flex;gap:8px;align-items:center;">
          ${sel.length>0?`<button class="btn-secondary" style="padding:8px 14px;font-size:13px;color:var(--danger);border-color:var(--danger);font-weight:600;" data-action="eliminar-mesas-sel">🗑️ Eliminar (${sel.length})</button>`:''}
          <button class="btn-secondary" style="padding:8px 14px;font-size:13px;" data-action="toggle-modo-eliminar">
            ${S.modoEliminarMesas?'✓ Cancelar':'✏️ Seleccionar'}
          </button>
        </div>`:''}
    </div>
    <div style="flex:1;overflow-y:auto;">
      ${mesas.length===0?`
        <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:12px;color:var(--t3);padding:40px;">
          <div style="font-size:48px;">🪑</div>
          <div style="font-size:15px;font-weight:600;">No hay mesas abiertas</div>
          <div style="font-size:13px;text-align:center;">Agrega productos al carrito y presiona "Abrir Mesa" para comenzar una orden de mesa.</div>
        </div>`:
      `<div class="mesas-grid">
        ${mesas.map(m=>{
          const checked=sel.includes(m.id);
          return`
          <div class="mesa-card${checked?' mesa-card-selected':''}" data-action="${S.modoEliminarMesas?'toggle-sel-mesa':'ver-mesa'}" data-id="${m.id}"
            style="${checked?'border-color:var(--danger);box-shadow:0 0 0 2px var(--danger);':''}">
            ${S.modoEliminarMesas?`<div style="position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;border:2px solid ${checked?'var(--danger)':'var(--border)'};background:${checked?'var(--danger)':'transparent'};display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:700;">${checked?'✓':''}</div>`:''}
            <div class="mesa-card-name">🪑 ${esc(m.nombre)}</div>
            <div class="mesa-card-time">⏱ ${mesaElapsed(m.abierta_at)}</div>
            <div class="mesa-card-total">${fmt(m.total||0)}</div>

async function printComanda(mesa){
  const items=mesa.items||[];
  const total=items.reduce((s,i)=>s+(i.price*i.qty),0);
  const now=new Date();
  const timeStr=now.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit',hour12:false});
  const dateStr=now.toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'});

  // ── 1. BLE directo ──────────────────────────────────────────
  try{
    const ch=await getBlePrinter();
    if(ch){
      const ESC=0x1b;
      const a=[];
      const p=(...b)=>b.forEach(x=>a.push(x));
      const ln=(s='')=>{cp850(String(s)).forEach(x=>a.push(x));a.push(0x0A);}
      const sep=()=>ln('--------------------------------');
      const rjust=(l,r,w=32)=>{const sp=w-l.length-r.length;return l+(sp>0?' '.repeat(sp):' ')+r;}
      p(ESC,0x40);p(ESC,0x74,2);
      p(ESC,0x61,0x01);p(ESC,0x21,0x30);ln('LILO');
      p(ESC,0x21,0x00);ln('Barra de cafe');
      ln(dateStr+' '+timeStr);
      sep();
      p(ESC,0x61,0x00);
      p(ESC,0x45,0x01);ln('MESA: '+mesa.nombre);p(ESC,0x45,0x00);
      if(S.user?.name)ln('Atendio: '+S.user.name);
      sep();
      p(ESC,0x61,0x00);
      items.forEach(item=>{
        const sub=item.price*item.qty;
        ln(item.name.substring(0,24));
        ln(rjust('  '+item.qty+' x $'+item.price.toFixed(2),'$'+sub.toFixed(2)));
      });
      sep();
      p(ESC,0x45,0x01);ln(rjust('TOTAL:','$'+total.toFixed(2)));p(ESC,0x45,0x00);
      p(ESC,0x64,6);p(0x1D,0x56,0x42,0x00);
      await sendBleData(ch,new Uint8Array(a));
      return;
    }
  }catch(e){console.warn('BLE comanda error:',e);}

  // ── 2. Fallback: mismo div oculto que usa printTicket ──────
  const rows=items.map(i=>`<tr>
    <td class="tn">${esc(i.name)}</td>
    <td class="tq">${i.qty}</td>
    <td class="tp">${fmt(i.price*i.qty)}</td>
  </tr>`).join('');

  let el=document.getElementById('lilo-print');
  if(!el){el=document.createElement('div');el.id='lilo-print';document.body.appendChild(el);}
  el.innerHTML=`<style>

.lt .c{text-align:center;}.lt .r{text-align:right;}.lt .sm{font-size:11px;}

.lt .meta{font-size:11px;text-align:center;margin:1px 0;}
.lt .mesa-h{font-size:15px;font-weight:900;margin:4px 0;text-align:center;}

.lt td{padding:1px 0;vertical-align:top;}
.lt .tn{width:58%;word-break:break-word;font-size:12px;}
.lt .tq{width:12%;text-align:center;font-size:12px;}
.lt .tp{width:30%;text-align:right;font-size:12px;}
.lt .hd{font-weight:bold;font-size:10px;text-transform:uppercase;border-bottom:1px solid #000;padding-bottom:2px;}
.lt .tot td{font-size:18px;font-weight:900;padding-top:3px;}

</style>

<div class="meta">${dateStr} · ${timeStr}</div>
${S.user?.name?`<div class="meta">Atendio: ${esc(S.user.name)}</div>`:''}
<hr class="sd">

/* ══════════════════════════════════════════════
   DASHBOARD

function renderDashboard(){
  const d=S.dashData;
  if(!d)return`<div class="view"><div class="empty-state"><div class="empty-icon">⏳</div><div class="empty-text">Cargando…</div></div></div>`;
  return`
  <div class="view">
    <div class="dash-header">
      <div class="dash-title">Resumen de Ventas</div>
      <div class="date-tabs">
        ${[['today','Hoy'],['week','7 días'],['month','30 días']].map(([v,l])=>`<button class="date-tab${S.dateRange===v?' active':''}" data-action="date-range" data-range="${v}">${l}</button>`).join('')}
        <button class="date-tab${S.dateRange==='day'?' active':''}" data-action="date-range" data-range="day">📅 Día</button>
        <button class="date-tab${S.dateRange==='custom'?' active':''}" data-action="date-range" data-range="custom">📆 Rango</button>
      </div>
    </div>
    ${S.dateRange==='day'?`
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--rsm);padding:10px 14px;">
      <span style="font-size:12px;font-weight:600;color:var(--t2);white-space:nowrap;">📅 Día a consultar</span>
      <input type="date" id="dash-day" value="${S.customDay||new Date().toISOString().slice(0,10)}" max="${new Date().toISOString().slice(0,10)}"
        style="border:1.5px solid var(--border);border-radius:var(--rxs);padding:5px 8px;font-size:13px;background:var(--s2);color:var(--t1);flex:1;min-width:130px;">
      <button class="btn-primary" style="padding:6px 16px;font-size:13px;white-space:nowrap;" data-action="apply-day-range">Ver</button>
    </div>`:''}
    ${S.dateRange==='custom'?`
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--rsm);padding:10px 14px;">
      <span style="font-size:12px;font-weight:600;color:var(--t2);white-space:nowrap;">Desde</span>
      <input type="date" id="dash-from" value="${S.customFrom}" max="${new Date().toISOString().slice(0,10)}"
        style="border:1.5px solid var(--border);border-radius:var(--rxs);padding:5px 8px;font-size:13px;background:var(--s2);color:var(--t1);flex:1;min-width:130px;">
      <span style="font-size:12px;font-weight:600;color:var(--t2);white-space:nowrap;">Hasta</span>
      <input type="date" id="dash-to" value="${S.customTo}" max="${new Date().toISOString().slice(0,10)}"
        style="border:1.5px solid var(--border);border-radius:var(--rxs);padding:5px 8px;font-size:13px;background:var(--s2);color:var(--t1);flex:1;min-width:130px;">
      <button class="btn-primary" style="padding:6px 16px;font-size:13px;white-space:nowrap;" data-action="apply-custom-range">Aplicar</button>
    </div>`:''}
    ${S.dateRange==='custom'&&(!S.customFrom||!S.customTo)?`<div style="text-align:center;padding:8px;font-size:13px;color:var(--t3);margin-bottom:8px;">Selecciona las fechas y presiona Aplicar</div>`:''}

    <div class="stat-grid">
      <div class="stat-card">
        <div class="stat-label">Total General</div>
        <div class="stat-amount">${fmt(d.total)}</div>
        <div class="stat-sub">${d.salesCount} venta${d.salesCount!==1?'s':''}${d.cancelledCount>0?` · ${d.cancelledCount} cancelada${d.cancelledCount!==1?'s':''}`:''}  </div>
      </div>
      ${Object.entries(BRANDS).map(([b,bv])=>`
        <div class="stat-card" onclick="window._liloVerCategoria('${b}')" style="cursor:pointer;transition:box-shadow .15s;" onmouseover="this.style.boxShadow='0 4px 16px rgba(0,0,0,.1)'" onmouseout="this.style.boxShadow=''">
          <div class="stat-label"><span class="stat-dot" style="background:${bv.hex}"></span>${bv.icon} ${bv.name}</div>
          <div class="stat-amount" style="color:${bv.hex}">${fmt(d.brandTotals[b]||0)}</div>
          <div class="stat-sub">${d.total>0?Math.round((d.brandTotals[b]||0)/d.total*100)+'% del total':'—'} <span style="font-size:10px;color:${bv.hex};opacity:.7;">▶ ver</span></div>
        </div>`).join('')}
    </div>
    ${renderBrandPay(d)}
    <div class="charts-grid">
      <div class="chart-card">
        <div class="chart-title">Ventas por marca ${(S.dateRange==='today'||(S.dateRange==='custom'&&S.customFrom&&S.customFrom===S.customTo))?'(por hora)':'(por día)'} ${S.dateRange==='custom'&&S.customFrom?`· ${S.customFrom}${S.customTo&&S.customTo!==S.customFrom?' → '+S.customTo:''}`:''}</div>
        <div class="chart-wrap">${svgBarChart(d.chart)}</div>
      </div>
      <div class="chart-card" style="display:flex;flex-direction:column;">
        <div class="chart-title">Método de pago</div>
        <div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:4px 0;">
          ${(()=>{const tt=Object.keys(PAY).reduce((t,k)=>t+(d.payTotals[k]||0),0);return Object.entries(PAY).map(([m,pv])=>{const v=d.payTotals[m]||0;const pct=tt?Math.round(v/tt*100):0;return`
          <div onclick="window._liloVerMetodo('${m}')" style="display:flex;align-items:center;gap:12px;padding:14px 14px;min-height:56px;width:100%;box-sizing:border-box;background:var(--s2);border-radius:var(--rxs);border-left:6px solid ${PAY_COLOR[m]};cursor:pointer;transition:opacity .15s;${v>0?'':'opacity:.5;'}" onmouseover="this.style.opacity='.75'" onmouseout="this.style.opacity='${v>0?1:.5}'">
            <span style="font-size:22px;font-weight:800;min-width:58px;color:${PAY_COLOR[m]};">${pct}%</span>
            <span style="flex:1;font-size:14px;font-weight:600;color:var(--t1);">${pv.icon} ${pv.name}</span>
            <span style="font-size:15px;font-weight:700;color:var(--t1);">${fmt(v)} <span style="font-size:10px;opacity:.4;">▶</span></span>
          </div>`;}).join('');})()}
        </div>
      </div>
    </div>
    ${d.topProducts.length>0?`<div id="lilo-top" class="recent-card" style="margin-bottom:16px;padding:16px;">${renderTopProducts(d)}</div>`:''}
    ${d.sales.length>0?`
    <div class="recent-card">
      <div class="recent-header">Ventas recientes</div>
      <div id="lilo-recent">${renderRecentSales(d)}</div>
    </div>`:''}
    ${renderMesasStats(d)}
  </div>`;
}

function renderRecentSales(d){
  const list=S.recentAll?d.sales:d.sales.slice(0,10);
  const multiDay=S.dateRange!=='today'&&S.dateRange!=='day'&&!(S.dateRange==='custom'&&S.customFrom&&S.customFrom===S.customTo);
  return list.map(s=>{
        const isCancelled=s.status==='cancelled';
        let bt={};try{bt=JSON.parse(s.brand_totals||'{}');}catch(_){}
        return`
        <div class="sale-row" onclick="window._liloVerVenta('${s.id}')" style="${isCancelled?'opacity:.5;':''}cursor:pointer;">
          <span class="sale-time" style="${isCancelled?'text-decoration:line-through;':''}">${multiDay?fmtDateShort(s.timestamp)+' · ':''}${fmtTime(s.timestamp)}</span>
          <span class="sale-emp" style="${isCancelled?'text-decoration:line-through;color:var(--t3);':''}">${esc(s.employee_name||'—')}</span>
          ${isCancelled
            ?`<span style="flex:1;"><span style="background:var(--danger);color:#fff;font-size:9px;font-weight:700;padding:2px 6px;border-radius:3px;letter-spacing:.05em;display:inline-block;">CANCELADA</span></span>`
            :`<span style="flex:1;display:flex;gap:4px;flex-wrap:wrap;">${Object.entries(bt).filter(([,v])=>v>0).map(([b])=>{const bv=BRANDS[b]||{};return`<span class="brand-pill ${b==='amor_azucar'?'pill-aa':b==='crepa_roll'?'pill-cr':'pill-li'}" style="font-size:10px;">${bv.icon||''}</span>`;}).join('')}</span>`
          }
          <span class="pay-badge">${PAY[s.payment_method]?.icon||''}</span>
          <span class="sale-amount" style="${isCancelled?'text-decoration:line-through;color:var(--t3);':''}">${fmt(s.total)}</span>
          ${S.user?.role==='owner'&&!isCancelled?`<button onclick="event.stopPropagation();window._liloDashDelete('${s.id}')" style="margin-left:4px;padding:3px 7px;font-size:11px;border-radius:var(--rxs);border:1px solid var(--danger);color:var(--danger);background:transparent;cursor:pointer;flex-shrink:0;" title="Cancelar venta">✕</button>`:''}
        </div>`;}).join('')+(d.sales.length>10?`<div style="text-align:center;padding:10px 0 4px;"><button onclick="window._liloRecentAll()" style="background:none;border:none;color:var(--li);font-size:13px;font-weight:600;font-family:var(--font);cursor:pointer;padding:6px 12px;">${S.recentAll?'Ver menos ▴':`Ver todas las ventas (${d.sales.length}) ▾`}</button></div>`:'');
}
window._liloRecentAll=function(){S.recentAll=!S.recentAll;const el=document.getElementById('lilo-recent');if(el&&S.dashData)el.innerHTML=renderRecentSales(S.dashData);};


/* ══════════════════════════════════════════════
   GASTOS
══════════════════════════════════════════════ */
const GASTO_COL='#E8682A';
function _liloTodayStart(){const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate()).getTime();}
window._liloGasto=async function(){
  let hoy=[];
  try{hoy=(await db.gastos.toArray()).filter(g=>g.timestamp>=_liloTodayStart()).sort((a,b)=>b.timestamp-a.timestamp);}catch(e){console.warn('gastos',e);}
  const tot=hoy.reduce((t,g)=>t+(g.monto||0),0);
  _liloOverlay('lilo-gasto',`
    <div style="background:var(--surface);border-radius:16px;max-width:400px;width:100%;border:1px solid var(--border);box-shadow:0 12px 40px rgba(0,0,0,.35);max-height:90vh;overflow-y:auto;">
      <div style="display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--border);">
        <div style="font-size:18px;font-weight:700;color:${GASTO_COL};">Registrar gasto</div>
        <button onclick="_liloOverlayClose('lilo-gasto')" style="width:32px;height:32px;border-radius:50%;border:1.5px solid var(--border);background:transparent;color:var(--t1);font-size:16px;cursor:pointer;">✕</button>
      </div>
      <div style="padding:18px;">
        <div style="font-size:13px;color:var(--t2);margin-bottom:6px;">¿Cuánto fue?</div>
        <div style="display:flex;align-items:center;background:var(--s2);border:2px solid ${GASTO_COL};border-radius:12px;padding:6px 14px;">
          <span style="font-size:28px;font-weight:800;color:var(--t2);">$</span>
          <input id="gasto-monto" type="number" inputmode="decimal" min="0" step="0.5" placeholder="0.00" style="flex:1;min-width:0;background:transparent;border:none;outline:none;color:var(--t1);font-size:30px;font-weight:800;font-family:var(--font);padding:4px 8px;">
        </div>
        <div style="font-size:13px;color:var(--t2);margin:14px 0 6px;">¿En qué se gastó?</div>
        <textarea id="gasto-nota" rows="2" placeholder="Ej. 2 bolsas de hielo" style="width:100%;box-sizing:border-box;background:var(--s2);border:1px solid var(--border);border-radius:12px;padding:12px 14px;font-size:15px;color:var(--t1);font-family:var(--font);resize:none;outline:none;"></textarea>
        <div id="gasto-err" style="color:var(--danger);font-size:13px;margin-top:8px;display:none;"></div>
        <button id="gasto-ok" onclick="window._liloGuardarGasto()" style="width:100%;margin-top:14px;background:${GASTO_COL};color:#fff;border:none;border-radius:12px;padding:14px;font-size:16px;font-weight:700;font-family:var(--font);cursor:pointer;">Guardar gasto</button>
        <div style="font-size:12px;font-weight:700;letter-spacing:.07em;color:var(--t3);margin:18px 0 8px;">GASTOS DE HOY · ${fmt(tot)}</div>
        ${hoy.length===0?`<div style="font-size:13px;color:var(--t3);padding:6px 0;">Todavía no hay gastos hoy</div>`:hoy.map(g=>`
          <div style="display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px;color:var(--t1);">
            <span><span style="color:var(--t3);font-size:12px;">${fmtTime(g.timestamp)}</span>&nbsp; ${esc(g.nota||'—')}</span><b style="white-space:nowrap;">${fmt(g.monto||0)}</b></div>`).join('')}
      </div>
    </div>`);
  setTimeout(()=>document.getElementById('gasto-monto')?.focus(),50);
};
window._liloGuardarGasto=async function(){
  const monto=parseFloat(document.getElementById('gasto-monto')?.value||'0')||0;
  const nota=(document.getElementById('gasto-nota')?.value||'').trim();
  const err=document.getElementById('gasto-err');
  const showErr=t=>{if(err){err.textContent=t;err.style.display='block';}};
  if(monto<=0)return showErr('Escribe cuánto fue el gasto.');
  if(!nota)return showErr('Escribe en qué se gastó.');
  const btn=document.getElementById('gasto-ok');if(btn){btn.disabled=true;btn.textContent='Guardando…';}
  try{
    await db.gastos.add({monto,nota,timestamp:Date.now(),employee_id:S.user?.id||null,employee_name:S.user?.name||'',shift_id:S.shift?.id||null});
    await window._liloGasto();
  }catch(e){
    console.error('Error guardando gasto',e);
    if(btn){btn.disabled=false;btn.textContent='Guardar gasto';}
    showErr('No se pudo guardar el gasto. Revisa la conexión e intenta de nuevo.');
  }
};
window._liloGastosRange=async function(r){S.gastosRange=r;S.gastosDate='';await navigateTo('gastos');};
window._liloGastosDate=async function(){S.gastosDate=document.getElementById('gastos-date')?.value||'';if(S.gastosDate)S.gastosRange='day';await navigateTo('gastos');};
window._liloBorrarGasto=async function(id){
  _liloOverlay('lilo-gasto-del',`<div style="background:var(--surface);border-radius:16px;padding:22px;max-width:340px;width:100%;text-align:center;">
    <div style="font-size:30px;">🗑</div><div style="font-size:16px;font-weight:700;color:var(--t1);margin-top:6px;">¿Eliminar este gasto?</div>
    <div style="font-size:13px;color:var(--t2);margin-top:6px;">No se puede deshacer.</div>
    <div style="display:flex;gap:8px;margin-top:16px;">
      <button onclick="_liloOverlayClose('lilo-gasto-del')" style="flex:1;padding:11px;border-radius:10px;border:1.5px solid var(--border);background:transparent;color:var(--t1);font-weight:600;font-family:var(--font);cursor:pointer;">No</button>
      <button onclick="(async()=>{try{await db.gastos.delete('${id}');}catch(e){console.error(e);}_liloOverlayClose('lilo-gasto-del');await navigateTo('gastos');})()" style="flex:1;padding:11px;border-radius:10px;border:none;background:var(--danger);color:#fff;font-weight:700;font-family:var(--font);cursor:pointer;">Sí, eliminar</button>
    </div></div>`);
};
async function renderGastos(){
  const r=S.gastosRange||'today';
  const n=new Date();const t0=_liloTodayStart();
  let from=t0,to=Date.now()+86400000;
  if(r==='week')from=t0-6*86400000;
  else if(r==='month')from=t0-29*86400000;
  else if(r==='day'&&S.gastosDate){from=new Date(S.gastosDate+'T00:00:00').getTime();to=from+86400000;}
  let all=[];try{all=await db.gastos.toArray();}catch(e){console.warn(e);}
  const list=all.filter(g=>g.timestamp>=from&&g.timestamp<to).sort((a,b)=>b.timestamp-a.timestamp);
  const tot=list.reduce((t,g)=>t+(g.monto||0),0);
  const groups={};list.forEach(g=>{const k=_liloDayKey(g.timestamp);(groups[k]=groups[k]||[]).push(g);});
  const tab=(v,l)=>`<button onclick="window._liloGastosRange('${v}')" style="border:none;padding:7px 12px;font-size:13px;font-family:var(--font);cursor:pointer;border-radius:8px;background:${r===v?'var(--s3)':'transparent'};color:${r===v?'var(--t1)':'var(--t2)'};font-weight:${r===v?600:400};">${l}</button>`;
  const todayStr=_liloDayKey(Date.now());
  const head=`<div class="section-header" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
    <div class="section-title" style="flex:1;">Gastos</div>
    <div style="display:flex;gap:2px;background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:3px;">${tab('today','Hoy')}${tab('week','7 días')}${tab('month','30 días')}</div>
    <input type="date" id="gastos-date" value="${S.gastosDate||''}" max="${todayStr}" onchange="window._liloGastosDate()" style="border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:13px;background:var(--surface);color:var(--t1);font-family:var(--font);">
    <button onclick="window._liloGasto()" style="border:2px solid ${GASTO_COL};color:${GASTO_COL};background:rgba(232,104,42,.1);border-radius:50px;padding:6px 14px;font-size:13px;font-weight:700;font-family:var(--font);cursor:pointer;">Registrar gasto</button>
  </div>`;
  const summary=`<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;">
    <div style="flex:1;min-width:180px;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r);padding:16px;"><div style="font-size:12px;color:var(--t2);">Total gastado</div><div style="font-size:28px;font-weight:800;color:${GASTO_COL};">${fmt(tot)}</div></div>
    <div style="flex:1;min-width:140px;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r);padding:16px;"><div style="font-size:12px;color:var(--t2);">Gastos</div><div style="font-size:28px;font-weight:800;color:var(--t1);">${list.length}</div></div>
    <div style="flex:1;min-width:140px;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r);padding:16px;"><div style="font-size:12px;color:var(--t2);">Promedio por gasto</div><div style="font-size:28px;font-weight:800;color:var(--t1);">${fmt(list.length?tot/list.length:0)}</div></div>
  </div>`;
  const body=list.length===0?`<div class="empty-state" style="margin-top:24px;"><div class="empty-icon">🧾</div><div class="empty-text">Sin gastos en este período</div></div>`
    :Object.keys(groups).sort().reverse().map(k=>{
      const g=groups[k];const st=g.reduce((t,x)=>t+(x.monto||0),0);
      const dn=new Date(k+'T12:00:00').toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'});
      return`<div class="recent-card" style="margin-bottom:12px;padding:14px 16px;">
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;"><span style="font-size:15px;font-weight:700;color:var(--t1);text-transform:capitalize;">${dn}${k===todayStr?' · Hoy':''}</span><span style="font-size:16px;font-weight:800;color:${GASTO_COL};">${fmt(st)}</span></div>
        ${g.map(x=>`<div style="display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--border);">
          <span style="font-size:13px;color:var(--t3);width:44px;flex-shrink:0;">${fmtTime(x.timestamp)}</span>
          <span style="flex:1;font-size:14px;color:var(--t1);">${esc(x.nota||'—')}<span style="font-size:12px;color:var(--t2);"> · ${esc(x.employee_name||'—')}</span></span>
          <span style="font-size:15px;font-weight:700;color:var(--t1);white-space:nowrap;">${fmt(x.monto||0)}</span>
          <button onclick="window._liloBorrarGasto('${x.id}')" style="font-size:12px;color:var(--danger);border:1px solid var(--danger);background:transparent;border-radius:6px;padding:4px 9px;font-family:var(--font);cursor:pointer;">Eliminar</button>
        </div>`).join('')}
      </div>`;}).join('');
  return`<div class="view">${head}${summary}${body}</div>`;
}

/* ── Tiempo en mesas ── */
function _liloDur(ms){const m=Math.max(0,Math.round(ms/60000));return m<60?`${m} min`:`${Math.floor(m/60)} h ${String(m%60).padStart(2,'0')} min`;}
function _liloDurCol(ms){const m=ms/60000;return m<30?'#43A047':m<60?'#E8B84B':m<120?'#E8682A':'#D81B60';}
function _liloMesaTotal(m){const it=m.items||[];return it.length?it.reduce((t,i)=>t+(i.price||0)*(i.qty||0),0):(m.total||0);}
function renderMesasStats(d){
  const md=d&&d.mesas;if(!md)return'';
  const closed=md.closed||[],open=(md.open||[]).slice().sort((a,b)=>a.abierta_at-b.abierta_at);
  const now=Date.now();
  const card=inner=>`<div class="recent-card" style="margin-top:16px;padding:16px;">${inner}</div>`;
  const title=`<div style="font-size:16px;font-weight:700;color:var(--t1);">🪑 Tiempo en mesas</div>`;
  let openHtml='';
  if(open.length===1){
    const m=open[0];
    openHtml=`<span style="font-size:12px;font-weight:600;color:#E8B84B;background:#E8B84B22;border-radius:12px;padding:4px 10px;">🟢 1 mesa abierta ahora · ${esc(m.nombre||'Mesa')} lleva <span data-open-since="${m.abierta_at}">${_liloDur(now-m.abierta_at)}</span></span>`;
  } else if(open.length>1){
    openHtml=`<div style="margin-top:12px;background:#E8B84B14;border:1px solid #E8B84B55;border-radius:14px;padding:12px;">
      <div style="font-size:13px;font-weight:700;color:#E8B84B;margin-bottom:10px;">🟢 ${open.length} mesas abiertas ahora <span style="font-weight:400;color:var(--t2);">· de la que lleva más tiempo a la que lleva menos</span></div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;">
      ${open.map(m=>{const ms=now-m.abierta_at,c=_liloDurCol(ms);return`<div data-open-card="${m.abierta_at}" style="background:var(--s2);border-radius:12px;padding:10px 12px;border-left:6px solid ${c};">
        <div style="display:flex;justify-content:space-between;align-items:baseline;gap:6px;"><span style="font-size:14px;font-weight:700;color:var(--t1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(m.nombre||'Mesa')}</span><span style="font-size:12px;color:var(--t2);">${fmt(_liloMesaTotal(m))}</span></div>
        <div data-open-since="${m.abierta_at}" style="font-size:20px;font-weight:800;color:${c};margin-top:2px;">${_liloDur(ms)}</div>
        <div style="font-size:11px;color:var(--t2);">abierta desde las ${fmtTime(m.abierta_at)}</div></div>`;}).join('')}
      </div></div>`;
  }
  const head=`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">${title}${open.length===1?openHtml:''}</div>${open.length>1?openHtml:''}`;
  if(closed.length===0)return card(head+`<div style="text-align:center;padding:22px 0 8px;color:var(--t3);font-size:13px;">Sin mesas cobradas en este período</div>`);
  const durs=closed.map(m=>({m,ms:m.cerrada_at-m.abierta_at}));
  const avg=durs.reduce((t,x)=>t+x.ms,0)/durs.length;
  const fast=durs.reduce((a,b)=>b.ms<a.ms?b:a),slow=durs.reduce((a,b)=>b.ms>a.ms?b:a);
  const avgTicket=closed.reduce((t,m)=>t+_liloMesaTotal(m),0)/closed.length;
  const avgMin=Math.round(avg/60000);
  const avgBig=avgMin<60?`${avgMin}<span style="font-size:22px;"> min</span>`:`${Math.floor(avgMin/60)}<span style="font-size:22px;"> h </span>${String(avgMin%60).padStart(2,'0')}<span style="font-size:22px;"> min</span>`;
  const B=[['Menos de 30 min',0,30,'#43A047'],['30 a 60 min',30,60,'#E8B84B'],['1 a 2 horas',60,120,'#E8682A'],['Más de 2 horas',120,1e9,'#D81B60']]
    .map(([l,a,b,c])=>({l,c,n:durs.filter(x=>x.ms/60000>=a&&x.ms/60000<b).length}));
  const mx=Math.max(...B.map(b=>b.n),1);
  const bars=B.map(b=>`<div style="display:flex;align-items:center;gap:10px;margin-bottom:9px;">
    <span style="width:118px;font-size:13px;color:var(--t1);flex-shrink:0;">${b.l}</span>
    <div style="flex:1;height:22px;background:var(--s3);border-radius:6px;overflow:hidden;"><div style="width:${b.n?Math.max(3,Math.round(b.n/mx*100)):0}%;height:100%;background:${b.c};border-radius:6px;"></div></div>
    <span style="width:74px;text-align:right;font-size:13px;font-weight:700;color:var(--t1);">${b.n} mesa${b.n!==1?'s':''}</span>
    <span style="width:38px;text-align:right;font-size:12px;color:var(--t2);">${Math.round(b.n/durs.length*100)}%</span></div>`).join('');
  const stat=(ic,l,v,sub,c)=>`<div style="flex:1;min-width:140px;background:var(--s2);border-radius:12px;padding:12px;"><div style="font-size:12px;color:var(--t2);">${ic} ${l}</div><div style="font-size:21px;font-weight:800;color:${c||'var(--t1)'};margin-top:4px;">${v}</div><div style="font-size:11px;color:var(--t2);margin-top:2px;">${sub}</div></div>`;
  return card(`${head}
    <div style="display:flex;gap:14px;margin-top:14px;flex-wrap:wrap;">
      <div style="flex:0 0 220px;background:var(--s2);border-radius:14px;padding:18px;text-align:center;display:flex;flex-direction:column;justify-content:center;">
        <div style="font-size:13px;color:var(--t2);">Tiempo promedio</div>
        <div style="font-size:50px;font-weight:800;color:#E8B84B;line-height:1.1;margin-top:4px;">${avgBig}</div>
        <div style="font-size:13px;color:var(--t2);margin-top:6px;">de ${closed.length} mesa${closed.length!==1?'s':''} cobrada${closed.length!==1?'s':''}</div>
      </div>
      <div style="flex:1;min-width:280px;display:flex;flex-direction:column;gap:10px;">
        <div style="display:flex;gap:10px;flex-wrap:wrap;">
          ${stat('⚡','Más rápida',_liloDur(fast.ms),`${esc(fast.m.nombre||'Mesa')} · ${fmtTime(fast.m.abierta_at)}`,'#43A047')}
          ${stat('🐢','Más larga',_liloDur(slow.ms),`${esc(slow.m.nombre||'Mesa')} · ${fmtTime(slow.m.abierta_at)}`,'#D81B60')}
          ${stat('💰','Consumo promedio',fmt(avgTicket),'por mesa')}
        </div>
        <div style="background:var(--s2);border-radius:12px;padding:14px 14px 6px;"><div style="font-size:12px;color:var(--t2);margin-bottom:10px;">¿Cuánto tiempo se quedan?</div>${bars}</div>
      </div>
    </div>
    <div style="font-size:11px;color:var(--t3);margin-top:10px;">Solo cuenta mesas cobradas en el período seleccionado.</div>`);
}
setInterval(()=>{
  const now=Date.now();
  document.querySelectorAll('[data-open-since]').forEach(el=>{const t=+el.dataset.openSince;el.textContent=_liloDur(now-t);if(el.style.color)el.style.color=_liloDurCol(now-t);});
  document.querySelectorAll('[data-open-card]').forEach(el=>{el.style.borderLeftColor=_liloDurCol(now-(+el.dataset.openCard));});
},60000);

function renderInventory(){
  const prods=S.products.slice().sort((a,b)=>{if(a.track_stock&&!b.track_stock)return-1;if(!a.track_stock&&b.track_stock)return 1;return a.brand.localeCompare(b.brand);});
  return`
  <div class="view">
    <div class="section-header"><div class="section-title">Inventario</div></div>
    <div class="table-wrap">
      <table class="data-table">
        <thead><tr><th>Producto</th><th>Marca</th><th>Stock</th><th>Estado</th><th>Acciones</th></tr></thead>
        <tbody>
          ${prods.map(p=>{
            const bv=BRANDS[p.brand]||{};
            const low=p.track_stock&&p.stock>0&&p.stock<=5;
            const out=p.track_stock&&p.stock===0;
            return`<tr>
              <td style="font-weight:500;">${esc(p.name)}</td>
              <td><span class="brand-pill ${p.brand==='amor_azucar'?'pill-aa':p.brand==='crepa_roll'?'pill-cr':'pill-li'}">${bv.icon||''} ${bv.short||p.brand}</span></td>
              <td style="font-variant-numeric:tabular-nums;font-weight:600;">${p.track_stock?p.stock:'∞'}</td>
              <td>${p.track_stock?`<span class="stock-badge ${out?'stock-out':low?'stock-low':'stock-ok'}">${out?'Agotado':low?'Bajo':'OK'}</span>`:`<span class="stock-badge stock-ok">Libre</span>`}</td>
              <td class="row-actions">
                ${p.track_stock?`<button class="btn-icon" data-action="add-stock" data-id="${p.id}">+ Stock</button>`:''}
                <button class="btn-icon" data-action="edit-product" data-id="${p.id}">Editar</button>
