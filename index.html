function _liloHistModeToggle(){
  const m=S.historyMode||'day';
  const b=(v,l)=>`<button onclick="window._liloHistMode('${v}')" style="border:none;padding:6px 12px;font-size:12px;font-weight:600;font-family:var(--font);cursor:pointer;background:${m===v?'var(--li)':'transparent'};color:${m===v?'#fff':'var(--t2)'};">${l}</button>`;
  return`<div style="display:flex;border:1px solid var(--border);border-radius:var(--rxs);overflow:hidden;">${b('day','📅 Por día')}${b('shift','🕐 Por turno')}</div>`;
}
window._liloHistMode=async function(m){S.historyMode=m;S.histPayFilter=null;await navigateTo('history');};
window._liloAskDeleteDay=async function(k,evt){
  if(evt){evt.preventDefault();evt.stopPropagation();}
  if(S.user?.role!=='owner')return;
  const from=new Date(k+'T00:00:00').getTime(),to=from+86400000;
  const sales=await db.sales.where('timestamp').between(from,to,true,false).toArray();
  const total=sales.filter(x=>x.status!=='cancelled').reduce((t,x)=>t+(x.total||0),0);
  const dayName=new Date(k+'T12:00:00').toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'});
  _liloOverlay('lilo-delday',`
    <div style="background:var(--surface);border-radius:16px;padding:22px;max-width:360px;width:100%;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.35);">
      <div style="font-size:34px;">🗑</div>
      <div style="font-size:17px;font-weight:700;color:var(--t1);margin-top:6px;">¿Estás seguro de eliminar las ventas de este día?</div>
      <div style="font-size:14px;font-weight:600;color:var(--t2);margin-top:4px;text-transform:capitalize;">${dayName}</div>
      <div style="font-size:14px;color:var(--t2);margin-top:8px;line-height:1.45;">Se borrarán <strong style="color:var(--t1);">${sales.length} venta${sales.length!==1?'s':''}</strong> por <strong style="color:var(--t1);">${fmt(total)}</strong>.<br>Esto <strong style="color:var(--danger);">no se puede deshacer</strong>.</div>
      <div style="display:flex;gap:8px;margin-top:18px;">
        <button onclick="_liloOverlayClose('lilo-delday')" style="flex:1;padding:11px;border-radius:var(--rsm);border:1.5px solid var(--border);background:transparent;color:var(--t1);font-size:14px;font-weight:600;font-family:var(--font);cursor:pointer;">No, volver</button>
        <button id="lilo-delday-ok" onclick="window._liloDoDeleteDay('${k}')" style="flex:1;padding:11px;border-radius:var(--rsm);border:none;background:var(--danger);color:#fff;font-size:14px;font-weight:700;font-family:var(--font);cursor:pointer;">Sí, eliminar</button>
      </div>
    </div>`);
};
window._liloDoDeleteDay=async function(k){
  if(S.user?.role!=='owner')return;
  const btn=document.getElementById('lilo-delday-ok');if(btn){btn.disabled=true;btn.textContent='Eliminando…';}
  const from=new Date(k+'T00:00:00').getTime(),to=from+86400000;
  const sales=await db.sales.where('timestamp').between(from,to,true,false).toArray();
  for(const x of sales){try{await db.sales.delete(x.id);}catch(e){console.warn('No se pudo borrar venta',x.id,e);}}
  _liloOverlayClose('lilo-delday');
  S.expandedDay=null;S.histPayFilter=null;S.dashData=null;
  await navigateTo('history');
};

window._liloToggleDay=async function(k,evt){
  if(evt){evt.preventDefault();evt.stopPropagation();}
  S.expandedDay=(S.expandedDay===k)?null:k;S.pendingDeleteSaleId=null;
  await navigateTo('history');
};
function _liloDayKey(ts){const d=new Date(ts);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

async function renderHistoryDays(){
  const _n=new Date();
  const todayStr=_liloDayKey(_n.getTime());
  let from,to;
  if(S.historyDate){from=new Date(S.historyDate+'T00:00:00').getTime();to=from+86400000;}
  else{const st=new Date(_n.getFullYear(),_n.getMonth(),_n.getDate()-29);from=st.getTime();to=Date.now()+86400000;}
  const all=await db.sales.where('timestamp').between(from,to,true,false).toArray();
  const groups={};
  all.forEach(sv=>{const k=_liloDayKey(sv.timestamp);(groups[k]=groups[k]||[]).push(sv);});
  const keys=Object.keys(groups).sort().reverse();
  const dateInput=`<input type="date" id="hist-date-input" value="${S.historyDate||''}" max="${todayStr}" style="border:1px solid var(--border);border-radius:var(--rxs);padding:6px 10px;font-size:13px;background:var(--surface);color:var(--t1);font-family:var(--font);">`;
  const clearBtn=S.historyDate?`<button class="btn-icon" data-action="history-clear-date" style="font-size:12px;">✕ Todos</button>`:'';
  const header=`<div class="section-header" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
    <div class="section-title" style="flex:1;">Historial por Día</div>
    ${_liloHistModeToggle()}${dateInput}${clearBtn}
    <button class="btn-icon" data-action="history-apply-date" style="background:var(--li);color:#fff;font-size:12px;padding:6px 12px;">Filtrar</button>
  </div>`;
  if(keys.length===0)return`<div class="view">${header}<div class="empty-state" style="margin-top:32px;"><div class="empty-icon">📅</div><div class="empty-text">Sin ventas ${S.historyDate?'en esta fecha':'en los últimos 30 días'}</div></div></div>`;
  const isAdmin=S.user?.role==='owner';
  const cards=keys.map(k=>{
    const allDay=groups[k];
    const sales=allDay.filter(x=>x.status!=='cancelled');
    const cancelled=allDay.length-sales.length;
    const total=sales.reduce((a,x)=>a+(x.total||0),0);
    const bt={amor_azucar:0,crepa_roll:0,lilo:0};
    const pt={cash:0,card:0,transfer:0};
    sales.forEach(x=>{
      try{const bx=JSON.parse(x.brand_totals||'{}');Object.keys(bx).forEach(b=>{bt[b]=(bt[b]||0)+bx[b];});}catch(_){}
      if(x.payment_details){try{const pd=JSON.parse(x.payment_details);Object.keys(pd).forEach(m=>{pt[m]=(pt[m]||0)+pd[m];});}catch(_){}}
      else{pt[x.payment_method]=(pt[x.payment_method]||0)+(x.total||0);}
    });
    const people=[...new Set(allDay.map(x=>x.employee_name).filter(Boolean))].join(', ');
    const exp=S.expandedDay===k;
    const payF=(S.histPayFilter&&S.histPayFilter.shift==='day-'+k)?S.histPayFilter.method:null;
    const list=(payF?allDay.filter(x=>_liloSaleHasMethod(x,payF)):allDay).sort((a,b)=>a.timestamp-b.timestamp);
    const dObj=new Date(k+'T12:00:00');
    const dayName=dObj.toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
    const isToday=k===todayStr;
    return`
    <div class="shift-card">
      <button class="shift-head" onclick="window._liloToggleDay('${k}',event)" style="width:100%;text-align:left;background:none;border:none;font-family:var(--font);cursor:pointer;display:flex;align-items:center;gap:12px;padding:14px 16px;color:inherit;">
        <div class="shift-dot" style="background:${isToday?'var(--ok)':'var(--t3)'}"></div>
        <div class="shift-meta">
          <div class="shift-name" style="text-transform:capitalize;">${dayName}${isToday?' · Hoy':''}</div>
          <div class="shift-time">${esc(people||'—')}</div>
        </div>
        <div style="text-align:right;margin-left:auto;">
          <div class="shift-total">${fmt(total)}</div>
          <div style="font-size:11px;color:var(--t3);">${sales.length} venta${sales.length!==1?'s':''}${cancelled>0?` · <span style="color:var(--danger);">${cancelled}✕</span>`:''}  ${exp?'▲':'▼'}</div>
        </div>
      </button>
      ${exp?`
      <div class="shift-body">
        <div class="breakdown">
          ${Object.entries(BRANDS).map(([b,bv])=>`
            <div class="breakdown-item">
              <div class="breakdown-label" style="color:${bv.hex}">${bv.icon} ${bv.name}</div>
              <div class="breakdown-amount">${fmt(bt[b]||0)}</div>
            </div>`).join('')}
        </div>
        <div style="margin-bottom:12px;">${_liloPayPanel('day-'+k,sales,pt,payF,null)}</div>
        ${isAdmin?`<div style="display:flex;justify-content:flex-end;margin-bottom:10px;"><button onclick="window._liloAskDeleteDay('${k}',event)" style="background:transparent;border:1.5px solid var(--danger);color:var(--danger);border-radius:var(--rxs);padding:6px 12px;font-size:12px;font-weight:600;font-family:var(--font);cursor:pointer;">🗑 Eliminar ventas de este día</button></div>`:''}
        <div style="border-top:1px solid var(--border);padding-top:10px;">

async function renderHistory(){
  if((S.historyMode||'day')==='day')return renderHistoryDays();
  let allShifts=[];
  const filteredSalesMap={};
  const hasDateFilter=!!S.historyDate;
  if(hasDateFilter){
    const dayMs=new Date(S.historyDate+'T00:00:00').getTime();
    const dayEnd=dayMs+86400000;
    const daySales=await db.sales.where('timestamp').between(dayMs,dayEnd,true,false).toArray();
    daySales.forEach(s=>{if(!s.shift_id)return;if(!filteredSalesMap[s.shift_id])filteredSalesMap[s.shift_id]=[];filteredSalesMap[s.shift_id].push(s);});
    const shiftIds=new Set(Object.keys(filteredSalesMap));
    if(shiftIds.size>0){
      const allS=await db.shifts.toArray();
      allShifts=allS.filter(sh=>shiftIds.has(sh.id)).sort((a,b)=>b.start_time-a.start_time);

  return`<div class="view">${header}${html.join('')}</div>`;

let _bleDev=null,_bleCh=null;

async function getBlePrinter(){
  if(_bleCh&&_bleDev&&_bleDev.gatt.connected)return _bleCh;
  _bleDev=null;_bleCh=null;
  if(!navigator.bluetooth)return null;
  // Known BLE GATT profiles for Chinese thermal printers
  const P=[
    {s:'000018f0-0000-1000-8000-00805f9b34fb',c:'00002af1-0000-1000-8000-00805f9b34fb'},
    {s:'49535343-fe7d-4ae5-8fa9-9fafd205e455',c:'49535343-8841-43f4-a8d4-ecbe34729bb3'},
    {s:'6e400001-b5a3-f393-e0a9-e50e24dcca9e',c:'6e400002-b5a3-f393-e0a9-e50e24dcca9e'},
  ];
  try{
    const dev=await navigator.bluetooth.requestDevice({
      filters:[{name:'GLPrint_BLE'},{name:'GLPrint'},{namePrefix:'GL'}],
      optionalServices:P.map(p=>p.s)
    });
    const srv=await dev.gatt.connect();
    for(const p of P){
      try{
        const svc=await srv.getPrimaryService(p.s);
        const ch=await svc.getCharacteristic(p.c);
        _bleDev=dev;_bleCh=ch;
        dev.addEventListener('gattserverdisconnected',()=>{_bleDev=null;_bleCh=null;});
        return ch;
      }catch(e){}
    }
  }catch(e){console.warn('BLE connect:',e);}
  return null;
}

function cp850(str){
  const m={'á':0xa0,'é':0x82,'í':0xa1,'ó':0xa2,'ú':0xa3,'ñ':0xa4,
    'Á':0xb5,'É':0x90,'Í':0xd6,'Ó':0xe0,'Ú':0xe9,'Ñ':0xa5,
    'ü':0x81,'Ü':0x9a,'¡':0xad,'¿':0xa8};
  const a=[];
  for(const c of str){
    if(m[c]!==undefined)a.push(m[c]);
    else{const x=c.charCodeAt(0);a.push(x<128?x:63);}
  }
  return a;
}

function buildEscPos(td){
  const d=new Date(td.timestamp);
  const ds=d.toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'});
  const ts=d.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit',hour12:false});
  const LF=0x0A,ESC=0x1B;
  const a=[];
  const p=(...b)=>b.forEach(x=>a.push(x));
  const t=(s)=>cp850(String(s)).forEach(x=>a.push(x));
  const ln=(s='')=>{t(s);p(LF);}
  const sep=()=>{t('--------------------------------');p(LF);}
  const row=(l,r,w=32)=>{
    const sp=Math.max(1,w-String(l).length-String(r).length);
    ln(l+' '.repeat(sp)+r);
  };

  p(ESC,0x40);       // init
  p(ESC,0x74,2);     // codepage PC850 (soporta español)
  p(ESC,0x61,1);     // centrar
  // Logo LILO grande
  p(ESC,0x21,0x38);  // doble alto+ancho+negrita
  t('L I L O');p(LF);
  p(ESC,0x21,0x00);  // normal
  ln('Barra de cafe');
  sep();
  ln(ds+' '+ts);
  if(td.employee)ln('Atencion: '+td.employee);
  sep();
  p(ESC,0x61,0);     // izquierda
  // Encabezado tabla
  p(ESC,0x45,1);
  ln('Producto           Cant  Total');
  p(ESC,0x45,0);
  t('--------------------------------');p(LF);
  for(const i of td.items){
    const nm=String(i.name).length>18?String(i.name).slice(0,17)+'.':String(i.name);
    const q='x'+i.qty;
    const pr=fmt(i.price*i.qty);
    const sp=Math.max(1,32-nm.length-q.length-pr.length-2);
    ln(nm+' '.repeat(sp)+q+'  '+pr);
  }
  sep();
  if(td.discount>0){
    row('Subtotal',fmt(td.subtotal));
    row('Descuento','-'+fmt(td.discount));
    sep();
  }
  p(ESC,0x61,0);
  p(ESC,0x21,0x20);  // doble alto para total
  row('TOTAL',fmt(td.total));
  p(ESC,0x21,0x00);
  sep();
  // Método de pago
  if(td.method==='mixed'&&td.payDetails){
    for(const[k,v] of Object.entries(td.payDetails)){
      if(v>0)row(PAY[k]?.name||k,fmt(v));
    }
  }else{
    ln(PAY[td.method]?.name||td.method||'');
  }
  if(td.cashReceived>0){
    row('Efectivo',fmt(td.cashReceived));
    p(ESC,0x45,1);
    row('Cambio',fmt(Math.max(0,td.change||0)));
    p(ESC,0x45,0);
  }
  sep();
  p(ESC,0x61,1);
  ln('Gracias por tu compra!');
  ln('');
  p(ESC,0x64,8);           // avanzar 8 lineas para que el corte quede limpio
  p(0x1D,0x56,0x42,0x00); // GS V 66 0 → corte parcial (deja pequeña tira para jalar)
  return new Uint8Array(a);
}

async function sendBleData(ch,data){
  const SZ=128;
  for(let i=0;i<data.length;i+=SZ){
    const sl=data.slice(i,i+SZ);
    try{await ch.writeValueWithoutResponse(sl);}
    catch(e){try{await ch.writeValue(sl);}catch(e2){throw e2;}}
    // Pausa entre bloques para que la impresora no se sature
    await new Promise(r=>setTimeout(r,40));
  }
  // Espera extra al final para que la impresora procese el último bloque
  await new Promise(r=>setTimeout(r,500));
}

async function printTicket(td){
  // ── 1. Intento BLE directo ──────────────────────────────────
  try{
    const ch=await getBlePrinter();
    if(ch){
      await sendBleData(ch,buildEscPos(td));
      return; // ✅ impreso por BLE
    }
  }catch(e){console.warn('BLE print error:',e);_bleDev=null;_bleCh=null;}

  // ── 2. Fallback: window.print() con contenedor oculto ───────
  const d=new Date(td.timestamp);
  const ds=d.toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'});
  const ts=d.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit',hour12:false});
  let payLines='';

      .map(([k,v])=>`<div>${PAY[k]?.name||k}: ${fmt(v)}</div>`).join('');
  }else{
    payLines=`<div>${PAY[td.method]?.name||td.method}</div>`;

  const rows=td.items.map(i=>`<tr>
    <td class="tn">${esc(i.name)}</td>
    <td class="tq">${i.qty}</td>

  const cashBlock=td.cashReceived>0?`
    <div class="sm">Efectivo: ${fmt(td.cashReceived)}</div>

  // Logo: usar el icono ya embebido en la página

  const logoImg=logoSrc?`<img src="${logoSrc}" style="width:56px;height:56px;border-radius:10px;display:block;margin:0 auto 4px;" alt="LILO">`:'';

  let el=document.getElementById('lilo-print');
  if(!el){el=document.createElement('div');el.id='lilo-print';document.body.appendChild(el);}
  el.innerHTML=`<style>
.lt{font-family:'Courier New',monospace;font-size:13px;width:74mm;color:#000;background:#fff;padding:2mm;}
.lt .c{text-align:center;}.lt .r{text-align:right;}.lt .sm{font-size:11px;}

.lt .sub{font-size:10px;letter-spacing:2px;text-transform:uppercase;text-align:center;margin-bottom:5px;}
.lt hr{border:none;margin:3px 0;}
.lt .sd{border-top:1px dashed #000;}.lt .ss{border-top:1px solid #000;}
.lt .meta{font-size:11px;text-align:center;margin:1px 0;}
.lt table{width:100%;border-collapse:collapse;}
.lt td{padding:1px 0;vertical-align:top;}
.lt .tn{width:58%;word-break:break-word;font-size:12px;}
.lt .tq{width:12%;text-align:center;font-size:12px;}
.lt .tp{width:30%;text-align:right;font-size:12px;}
.lt .hd{font-weight:bold;font-size:10px;text-transform:uppercase;border-bottom:1px solid #000;padding-bottom:2px;}
.lt .tot td{font-size:18px;font-weight:900;padding-top:3px;}
.lt .tot .r{text-align:right;}
.lt .foot{text-align:center;font-size:11px;margin-top:5px;}
</style>
<div class="lt">
${logoImg}

<hr class="sd">
<div class="meta">${ds} · ${ts}</div>
<div class="meta">Atendio: ${esc(td.employee)}</div>
<hr class="sd">
<table><thead><tr>
<td class="tn hd">Producto</td>
<td class="tq hd" style="text-align:center;">Qty</td>

</tr></thead><tbody>${rows}</tbody></table>
<hr class="sd">

function renderCheckoutModal(){
  const items=S.cart;
  const subtotal=items.reduce((s,i)=>s+i.price*i.qty,0);
  const discount=calcDiscount(subtotal);
  const total=subtotal-discount;
  const bt={amor_azucar:0,crepa_roll:0,lilo:0};
  items.forEach(i=>{bt[i.brand]=(bt[i.brand]||0)+i.price*i.qty;});

  // Pago dividido
  const split=S.splitPay&&S.selectedPay;
  const pay1Amt=parseFloat(S.pay1Amount||'0')||0;
  const pay2Amt=split?Math.max(0,total-pay1Amt):0;
  const pay1Valid=!split||(pay1Amt>0&&pay1Amt<total);
  const pay2MethodOk=split&&S.pay2&&S.pay2!==S.selectedPay;

  // Pago simple - efectivo
  const cashIn=!split?(parseFloat(S.cashInput||'0')||0):0;
  const change=cashIn-total;

  // ¿se puede confirmar?
  let canConfirm=false;
  if(!split&&S.selectedPay){
    canConfirm=S.selectedPay!=='cash'||(cashIn>=total);
  } else if(split&&S.selectedPay&&pay2MethodOk&&pay1Amt>0&&pay1Amt<total){
    canConfirm=true;
  }

  return`
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Cobro</span>
      <button class="modal-close" data-action="close-modal">✕</button>
    </div>
    <div class="modal-body">
      <div class="checkout-total">
        <div class="checkout-total-label">${discount>0?`<span style="font-size:13px;text-decoration:line-through;color:var(--t3);margin-right:8px;">${fmt(subtotal)}</span>`:''}Total a cobrar</div>
        <div class="checkout-total-amount">${fmt(total)}</div>
        ${discount>0?`<div style="font-size:12px;color:var(--warn);font-weight:600;margin-top:4px;">🏷️ Descuento: −${fmt(discount)} (${esc(S.appliedDiscount?.name||'')})</div>`:''}
      </div>
      <div style="margin-bottom:14px;">
        ${Object.entries(bt).filter(([,v])=>v>0).map(([b,v])=>{const bv=BRANDS[b];return`
          <div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border);font-size:13px;">
            <span style="color:${bv?.hex}">${bv?.icon||''} ${bv?.name||b}</span>
            <span style="font-weight:600;">${fmt(v)}</span>
          </div>`;}).join('')}
      </div>

      ${!split?`
      <!-- Modo pago simple -->
      <div style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);margin-bottom:8px;">Forma de pago</div>
      <div class="pay-methods">
        ${Object.entries(PAY).map(([k,v])=>`
          <button class="pay-btn${S.selectedPay===k?' selected':''}" data-action="select-pay" data-pay="${k}">
            <span class="pi">${v.icon}</span>${v.name}
          </button>`).join('')}
      </div>
      ${S.selectedPay==='cash'?`
      <div class="cash-section">
        <div class="cash-label">¿Con cuánto paga?</div>
        <input class="cash-input" id="cash-input" type="number" inputmode="decimal" placeholder="${fmtN(total)}" value="${S.cashInput||''}" data-action="cash-input">
        ${cashIn>=total?`<div class="change-row"><span class="change-label">Cambio</span><span class="change-amount">${fmt(change)}</span></div>`:cashIn>0?`<div style="color:var(--danger);font-size:12px;margin-top:6px;">Faltan ${fmt(total-cashIn)}</div>`:''}
      </div>`:''}
      ${S.selectedPay?`
      <button data-action="toggle-split-pay" style="width:100%;margin-top:10px;padding:9px;border-radius:var(--rsm);border:1.5px dashed var(--border);font-size:13px;font-weight:500;color:var(--t2);background:transparent;">
        ⊕ Dividir en 2 formas de pago
      </button>`:''}
      `:`
      <!-- Modo pago dividido -->
      <div style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);margin-bottom:10px;">Pago dividido</div>
      <div style="background:var(--s2);border-radius:var(--rsm);padding:12px;margin-bottom:10px;">
        <div style="font-size:12px;font-weight:600;color:var(--t2);margin-bottom:8px;">Método 1</div>
        <div class="pay-methods" style="margin-bottom:8px;">
          ${Object.entries(PAY).map(([k,v])=>`
            <button class="pay-btn${S.selectedPay===k?' selected':''}" data-action="select-pay" data-pay="${k}" style="padding:10px 4px;">
              <span class="pi" style="font-size:18px;">${v.icon}</span><span style="font-size:11px;">${v.name}</span>
            </button>`).join('')}
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          <label style="font-size:12px;color:var(--t2);white-space:nowrap;">Monto:</label>
          <input class="form-input" id="pay1-amount" type="number" inputmode="decimal" placeholder="0.00" value="${S.pay1Amount||''}" data-action="pay1-amount-input" style="flex:1;padding:8px;">
        </div>
        ${pay1Amt>0&&pay1Amt>=total?`<div style="font-size:11px;color:var(--danger);margin-top:4px;">El monto debe ser menor al total (${fmt(total)})</div>`:''}
      </div>
      <div style="background:var(--s2);border-radius:var(--rsm);padding:12px;margin-bottom:10px;">
        <div style="font-size:12px;font-weight:600;color:var(--t2);margin-bottom:8px;">Método 2</div>
        <div class="pay-methods" style="margin-bottom:8px;">
          ${Object.entries(PAY).filter(([k])=>k!==S.selectedPay).map(([k,v])=>`
            <button class="pay-btn${S.pay2===k?' selected':''}" data-action="select-pay2" data-pay="${k}" style="padding:10px 4px;flex:1;">
              <span class="pi" style="font-size:18px;">${v.icon}</span><span style="font-size:11px;">${v.name}</span>
            </button>`).join('')}
        </div>
        ${pay1Amt>0&&pay1Amt<total?`
        <div style="display:flex;align-items:center;justify-content:space-between;padding:6px 0;font-size:13px;">
          <span style="color:var(--t2);">Restante:</span>
          <span style="font-weight:700;color:var(--ok);">${fmt(pay2Amt)}</span>
        </div>`:''}
      </div>
      <button data-action="toggle-split-pay" style="width:100%;padding:8px;border-radius:var(--rsm);border:1px solid var(--border);font-size:12px;color:var(--t3);background:transparent;margin-bottom:4px;">
        ✕ Cancelar — usar solo 1 forma de pago
      </button>
      `}

      <div class="modal-actions">
        <button class="btn-secondary" data-action="close-modal">Cancelar</button>
        <button class="btn-primary" data-action="confirm-sale"${canConfirm?'':' disabled'}>✓ Confirmar venta</button>
      </div>
    </div>
  </div>`;
}

/* ── Helper: inject/remove DOM overlays sin re-render (sin scroll) ── */
function _liloOverlay(id,html){
  let el=document.getElementById(id);
  if(!el){el=document.createElement('div');el.id=id;document.body.appendChild(el);}
  el.innerHTML=html;
  el.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto;';
}
function _liloOverlayClose(id){const el=document.getElementById(id);if(el)el.remove();}

/* ── Cancelar venta — overlay sin scroll ── */
function _liloCancelConfirmOverlay(saleId,context){
  _liloOverlay('lilo-cancel-overlay',`
    <div style="background:var(--surface,#fff);border-radius:16px;padding:24px 20px;max-width:320px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.25);">

        <button onclick="window._liloDoCancel('${saleId}','${context||'history'}')" style="flex:1;padding:12px;border-radius:10px;border:none;background:#e53935;color:#fff;font-size:14px;font-weight:600;cursor:pointer;">Sí, cancelar</button>
      </div>
    </div>`);
}
window._liloDoCancel=async function(saleId,context){
  _liloOverlayClose('lilo-cancel-overlay');
  const sale=await db.sales.get(saleId);
  if(!sale||sale.status==='cancelled'){if(context==='dashboard'){S.dashData=null;await navigateTo('dashboard');}else{await navigateTo('history');}return;}
  await db.sales.where('id').equals(saleId).modify({status:'cancelled'});
  // Regresar al inventario las piezas de productos con control de stock
  try{
    const items=JSON.parse(sale.items_json||'[]');
    for(const it of items){
      if(it.id==null||!(it.qty>0))continue;
      const prod=await db.products.get(it.id);
      if(prod&&prod.track_stock&&(prod.stock??0)<9999){
        await db.products.where('id').equals(it.id).modify(p=>{p.stock=(p.stock||0)+it.qty;});
      }
    }
    S.products=await db.products.filter(p=>p.active===1).toArray();
  }catch(e){console.warn('No se pudo regresar el stock',e);}
  if(sale?.shift_id){await _liloRecalcShift(sale.shift_id);}
  S.pendingDeleteSaleId=null;
  if(context==='dashboard'){S.dashData=null;await navigateTo('dashboard');}
  else{await navigateTo('history');}
};
window._liloDashDelete=function(saleId){_liloCancelConfirmOverlay(saleId,'dashboard');};
window._liloAskDelete=function(saleId){_liloCancelConfirmOverlay(saleId,'history');};
window._liloCancelDelete=function(){_liloOverlayClose('lilo-cancel-overlay');};

/* ── Ver ventas por método de pago ── */
window._liloVerMetodo=async function(method){
  const pv=PAY[method]||{name:method,icon:'💳'};
  const{from,to}=getRangeTs();
  const rawSales=await db.sales.where('timestamp').between(from,to,true,true).toArray();
  const matchingSales=rawSales.filter(s=>{
    if(s.status==='cancelled')return false;
    if(s.payment_method===method)return true;
    if(s.payment_method==='mixed'&&s.payment_details){try{return method in JSON.parse(s.payment_details);}catch(_){return false;}}
    return false;
  }).sort((a,b)=>b.timestamp-a.timestamp);
  const total=matchingSales.reduce((sum,s)=>{
    if(s.payment_method==='mixed'&&s.payment_details){try{return sum+(JSON.parse(s.payment_details)[method]||0);}catch(_){return sum;}}
    return sum+(s.total||0);
  },0);
  const rows=matchingSales.map(s=>`
    <div onclick="_liloOverlayClose('lilo-metodo-detail');window._liloVerVenta('${s.id}')" style="display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);cursor:pointer;font-size:13px;" onmouseover="this.style.opacity='.7'" onmouseout="this.style.opacity='1'">
      <div>
        <div style="font-weight:600;">${esc(s.employee_name||'—')}</div>
        <div style="font-size:11px;color:var(--t3);">🕐 ${fmtTime(s.timestamp)} · ${fmtDate(s.timestamp)}</div>
      </div>
      <span style="font-weight:700;color:var(--li);white-space:nowrap;">${fmt(s.payment_method==='mixed'&&s.payment_details?((p)=>{try{return JSON.parse(p)[method]||0;}catch(_){return 0;}})(s.payment_details):s.total||0)} ▶</span>
    </div>`).join('');
  _liloOverlay('lilo-metodo-detail',`
    <div style="background:var(--surface,#fff);border-radius:16px;padding:0;max-width:400px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.25);max-height:88vh;overflow-y:auto;">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:16px 18px 12px;border-bottom:1px solid #f0f0f0;position:sticky;top:0;background:var(--surface,#fff);border-radius:16px 16px 0 0;">
        <div>
          <div style="font-size:17px;font-weight:700;">${pv.icon} ${pv.name}</div>
          <div style="font-size:11px;color:var(--t3);margin-top:2px;">${matchingSales.length} venta${matchingSales.length!==1?'s':''} · Total: <strong style="color:var(--li);">${fmt(total)}</strong></div>
        </div>
        <button onclick="_liloOverlayClose('lilo-metodo-detail')" style="width:32px;height:32px;border-radius:50%;border:1.5px solid #ddd;background:transparent;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;">✕</button>
      </div>
      <div style="padding:4px 18px 16px;">
        ${matchingSales.length===0?`<div style="text-align:center;padding:28px 0;color:var(--t3);font-size:13px;">Sin ventas en este período</div>`:rows}
      </div>
    </div>`);
};

function renderBrandPay(d){

    return`<div style="flex:1;min-width:200px;background:var(--s2);border-radius:14px;padding:12px;border-top:4px solid ${bv.hex};">

window._liloVerCategoria=function(brand,sortBy){
  const d=S.dashData;
  if(!d)return;
  if(sortBy)S.catSort=sortBy;
  const mode=S.catSort||'money';
  const bv=BRANDS[brand]||{};
  const col=bv.hex||'var(--li)';
  const prods=d.topProducts.filter(p=>p.brand===brand)
    .sort((a,b)=>mode==='qty'?(b.qty-a.qty)||(b.total-a.total):(b.total-a.total)||(b.qty-a.qty));
  const catTotal=d.brandTotals[brand]||0;
  const sumTotal=prods.reduce((t,p)=>t+(p.total||0),0)||1;
  const pieces=prods.reduce((t,p)=>t+(p.qty||0),0);
  const maxV=prods.length?Math.max(...prods.map(p=>mode==='qty'?p.qty:p.total),1):1;
  const medal=['🥇','🥈','🥉'];
  const rows=prods.map((p,i)=>{
    const top=i<3;
    const v=mode==='qty'?p.qty:p.total;
    const pct=Math.round((p.total||0)/sumTotal*100);
    return`
    <div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);">
      <div style="width:26px;text-align:center;font-size:${top?20:13}px;font-weight:700;color:var(--t3);flex-shrink:0;">${top?medal[i]:i+1}</div>
      <div style="flex:1;min-width:0;">
        <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;">
          <span style="font-size:14px;font-weight:${top?700:500};color:var(--t1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(p.name)}</span>
          <span style="font-size:15px;font-weight:700;color:var(--t1);white-space:nowrap;">${mode==='qty'?p.qty+' pz':fmt(p.total)}</span>
        </div>
        <div style="display:flex;align-items:center;gap:8px;margin-top:5px;">
          <div style="flex:1;height:8px;background:var(--s3,rgba(128,128,128,.2));border-radius:4px;overflow:hidden;">
            <div style="height:100%;width:${Math.max(2,Math.round(v/maxV*100))}%;background:${col};opacity:${top?1:.6};border-radius:4px;"></div>
          </div>
          <span style="font-size:11px;color:var(--t2);white-space:nowrap;min-width:78px;text-align:right;">${mode==='qty'?fmt(p.total):p.qty+' pz'} · ${pct}%</span>
        </div>
      </div>
    </div>`;}).join('');
  const stat=(lbl,val,c)=>`<div style="flex:1;background:var(--s2);border-radius:12px;padding:10px 6px;text-align:center;"><div style="font-size:11px;color:var(--t2);">${lbl}</div><div style="font-size:21px;font-weight:800;color:${c||'var(--t1)'};margin-top:2px;">${val}</div></div>`;
  const tab=(m,lbl)=>`<button onclick="window._liloVerCategoria('${brand}','${m}')" style="border-radius:20px;padding:6px 14px;font-size:12px;font-weight:600;font-family:var(--font);cursor:pointer;border:1.5px solid ${mode===m?col:'var(--border)'};background:${mode===m?col:'transparent'};color:${mode===m?'#fff':'var(--t2)'};">${lbl}</button>`;
  _liloOverlay('lilo-cat-detail',`
    <div style="background:var(--surface,#fff);border-radius:16px;padding:0;max-width:400px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.25);max-height:88vh;overflow-y:auto;">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:16px 18px 12px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface,#fff);border-radius:16px 16px 0 0;z-index:1;">
        <div style="font-size:18px;font-weight:700;color:${col};">${bv.icon||''} ${bv.name||''}</div>
        <button onclick="_liloOverlayClose('lilo-cat-detail')" style="width:32px;height:32px;border-radius:50%;border:1.5px solid var(--border);background:transparent;color:var(--t1);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;">✕</button>
      </div>
      ${prods.length===0
        ?`<div style="text-align:center;padding:32px 18px;color:var(--t3);">Sin ventas en este período</div>`
        :`<div style="display:flex;gap:8px;padding:14px 18px 4px;">${stat('Vendido',fmt(catTotal),col)}${stat('Piezas',pieces)}${stat('Productos',prods.length)}</div>
      <div style="display:flex;gap:6px;padding:10px 18px 2px;">${tab('money','💰 Por dinero')}${tab('qty','📦 Por piezas')}</div>
      <div style="padding:4px 18px 16px;">${rows}</div>`}
    </div>`);
};

function _liloSaleHasMethod(s,method){
  if(s.payment_method===method)return true;
  if(s.payment_details){try{const pd=JSON.parse(s.payment_details);return (pd[method]||0)>0;}catch(_){return false;}}
  return false;
}

function _liloPayPanel(key,sales,pt,payF,fondo){
  const tot=Object.values(pt).reduce((a,b)=>a+(b||0),0);
  const cnt=m=>sales.filter(x=>_liloSaleHasMethod(x,m)).length;
  const card=(m,ic,name,v,n,col)=>{
    const on=(m==='all'&&!payF)||payF===m;const empty=n===0&&m!=='all';
    const pct=tot?Math.round(v/tot*100):0;
    return`<button onclick="window._liloHistPay('${key}','${m}',event)" style="flex:1;min-width:150px;position:relative;text-align:left;font-family:var(--font);cursor:pointer;background:${on?col+'22':'var(--s2)'};border:2px solid ${on?col:'var(--border)'};border-radius:14px;padding:12px 14px;color:var(--t1);opacity:${empty?.45:1};">
      ${on?`<span style="position:absolute;top:-10px;right:10px;background:${col};color:#1A1310;font-size:11px;font-weight:800;border-radius:10px;padding:1px 8px;">✓ Viendo</span>`:''}
      <div style="display:flex;justify-content:space-between;align-items:center;"><span style="font-size:22px;">${ic}</span>${m==='all'?'':`<span style="font-size:30px;font-weight:800;line-height:1;color:${col};">${pct}%</span>`}</div>
      <div style="font-size:13px;color:var(--t2);margin-top:6px;">${name}</div>
      <div style="font-size:21px;font-weight:800;color:${m==='all'?'var(--t1)':col};">${fmt(v)}</div>
      <div style="font-size:11px;color:var(--t2);">${n} venta${n!==1?'s':''}</div>
      ${m==='all'?'':`<div style="height:5px;background:var(--s3);border-radius:3px;margin-top:8px;overflow:hidden;"><div style="width:${pct}%;height:100%;background:${col};"></div></div>`}
    </button>`;};
  const ms=['cash','card','transfer'];
  const cards=card('all','📋','Todos',tot,sales.length,'#B8A49C')+ms.map(m=>card(m,PAY[m].icon,PAY[m].name,pt[m]||0,cnt(m),PAY_COLOR[m])).join('');
  const bar=tot?`<div style="display:flex;height:14px;border-radius:7px;overflow:hidden;margin:14px 0 4px;gap:2px;">${ms.filter(m=>pt[m]>0).map(m=>`<div style="width:${pt[m]/tot*100}%;background:${PAY_COLOR[m]};"></div>`).join('')}</div>
    <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:14px;color:var(--t2);">${ms.filter(m=>pt[m]>0).map(m=>`<span>${PAY[m].icon} ${PAY[m].name} <b style="font-size:20px;color:${PAY_COLOR[m]};">${Math.round(pt[m]/tot*100)}%</b></span>`).join('')}</div>`:'';
  let summary='';
  if(payF){
    const col=PAY_COLOR[payF];const n=cnt(payF);
    summary=`<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-top:14px;">
      <div style="font-size:13px;font-weight:700;color:${col};">${PAY[payF].icon} ${n} venta${n!==1?'s':''} ${payF==='cash'?'en':'con'} ${PAY[payF].name.toLowerCase()} · ${fmt(pt[payF]||0)}</div>
      ${payF==='cash'?`<div style="font-size:12px;color:var(--t2);">💰 Debe haber en caja: <b style="color:var(--t1);">${fondo!=null?fmt((pt.cash||0)+fondo):fmt(pt.cash||0)+'</b> + fondo<b>'}</b>${fondo!=null&&fondo>0?` <span style="color:var(--t3);">(incluye fondo ${fmt(fondo)})</span>`:''}</div>`:''}
    </div>`;
  }
  return`<div style="font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--t3);margin-bottom:12px;">¿CÓMO PAGARON? <span style="font-weight:400;letter-spacing:0;">· toca uno para ver solo esas ventas</span></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;padding-top:4px;">${cards}</div>${bar}${summary}`;
}
window._liloHistPay=async function(shiftId,method,evt){
  if(evt){evt.preventDefault();evt.stopPropagation();}
  const cur=S.histPayFilter;
  if(method==='all'){S.histPayFilter=null;S.histShowAll=null;await navigateTo('history');return;}
  S.histPayFilter=(cur&&cur.shift===shiftId&&cur.method===method)?null:{shift:shiftId,method};S.histShowAll=null;
  await navigateTo('history');
};
window._liloToggleShift=async function(shiftId,evt){
  if(evt){evt.preventDefault();evt.stopPropagation();}
  S.expandedShift=(S.expandedShift===shiftId)?null:shiftId;
  S.pendingDeleteSaleId=null;
  await navigateTo('history');
};

async function _liloRecalcShift(shiftId){
  try{
    const shift=await db.shifts.get(shiftId);
    if(!shift)return;
    const allSales=await db.sales.where('shift_id').equals(shiftId).toArray();
    const sales=allSales.filter(s=>s.status!=='cancelled');
    const pt={cash:0,card:0,transfer:0};
    sales.forEach(s=>{
      if(s.payment_details){try{const pd=JSON.parse(s.payment_details);Object.keys(pd).forEach(k=>{pt[k]=(pt[k]||0)+pd[k];});}catch(_){}}
      else{pt[s.payment_method]=(pt[s.payment_method]||0)+(s.total||0);}
    });
    // Ya no se sobrescribe cash_close: lo que declaró el cajero se conserva.
    // El efectivo esperado se calcula en vivo (excluyendo canceladas) en Historial y Cierre.
    void pt;
  }catch(_){}
}

function bindEvents(){
  const app=document.getElementById('app');
  app.removeEventListener('click',handleClick);
  app.removeEventListener('input',handleInput);
  app.addEventListener('click',handleClick);
  app.addEventListener('input',handleInput);
}

async function handleClick(e){
  const btn=e.target.closest('[data-action]');
  if(!btn)return;
  const action=btn.dataset.action;
  const{id,brand,view,pay,range}=btn.dataset;

  switch(action){
    case 'select-user':{
      const u=S.users.find(x=>x.id==id);
      if(!u)return;
      S.loginUser=u;S.pinBuffer='';
      render(renderLogin());
      break;
    }
    case 'pin-back':
      S.loginUser=null;S.pinBuffer='';render(renderLogin());break;
    case 'switch-user':
      _liloClearSession();_liloClearCart();
      if(window._liloUnsubs)window._liloUnsubs.forEach(u=>u());window._liloUnsubs=[];
      S.user=null;S.loginUser=null;S.pinBuffer='';S.cart=[];
      S.users=await db.users.toArray();
      render(renderLogin());break;
    case 'logout':
      _liloClearSession();_liloClearCart();
      if(window._liloUnsubs)window._liloUnsubs.forEach(u=>u());window._liloUnsubs=[];
      S.user=null;S.shift=null;S.cart=[];S.loginUser=null;S.pinBuffer='';S.appliedDiscount=null;
      S.users=await db.users.toArray();
      render(renderLogin());break;
    case 'navigate':
      await navigateTo(view);break;
    case 'filter-brand':
      S.brandFilter=brand;
      if(S.mesaAgregarOpen){
        render(renderShell(renderMesaDetalle())+renderAgregarProductosMesaModal());
        bindEvents();
      } else {
        await navigateTo('pos');
      }
      break;
    case 'add-to-cart':{
      const prod=S.products.find(p=>p.id==id);
      if(!prod)return;
      const ex=S.cart.find(c=>c.id==id);
      if(ex){ex.qty++;}else{S.cart.push({...prod,qty:1});}
      await navigateTo('pos');break;
    }
    case 'qty-inc':{
      const item=S.cart.find(c=>c.id==id);
      if(item){item.qty++;await navigateTo('pos');}break;
    }
    case 'qty-dec':{
      const idx=S.cart.findIndex(c=>c.id==id);
      if(idx>=0){S.cart[idx].qty--;if(S.cart[idx].qty<=0)S.cart.splice(idx,1);await navigateTo('pos');}break;
    }
    case 'clear-cart':
      S.cart=[];await navigateTo('pos');break;
    case 'open-checkout':
      if(S.cart.length===0)return;
      if(!S.shift){_liloNeedCorte();return;}
      S.modal='checkout';S.selectedPay='';S.cashInput='';S.splitPay=false;S.pay2='';S.pay1Amount='';
      await fullRender();break;
    case 'select-pay':
      S.selectedPay=pay;S.cashInput='';
      if(S.pay2===pay)S.pay2='';
      await fullRender();
      setTimeout(()=>{const el=document.getElementById('cash-input')||document.getElementById('pay1-amount');if(el)el.focus();},60);
      break;
    case 'select-pay2':
      S.pay2=pay;
      await fullRender();break;
    case 'toggle-split-pay':
      S.splitPay=!S.splitPay;S.pay2='';S.pay1Amount='';S.cashInput='';
      await fullRender();break;
    case 'confirm-sale':{
      if(S._saving||!S.cart.length)return;
      S._saving=true;_liloLockPayButtons();
      try{
      if(!S.selectedPay)return;
      const subtotal=S.cart.reduce((s,i)=>s+i.price*i.qty,0);
      const discAmt=calcDiscount(subtotal);
      const total=subtotal-discAmt;
      // Capturar datos del ticket ANTES de que recordSale limpie el carrito
      const ticketData={
        items:S.cart.map(i=>({...i})),
        subtotal,discount:discAmt,total,
        timestamp:Date.now(),
        employee:S.user?.name||'',
        method:'',cashReceived:null,change:null,payDetails:null
      };
      if(!S.shift){S.modal=null;_liloNeedCorte();return;}
      if(S.splitPay&&S.pay2){
        // Pago dividido
        const p1Amt=parseFloat(S.pay1Amount||0)||0;
        const p2Amt=Math.max(0,total-p1Amt);
        const payDetails={[S.selectedPay]:p1Amt,[S.pay2]:p2Amt};
        ticketData.method='mixed';ticketData.payDetails=payDetails;
        await recordSale('mixed',null,discAmt,payDetails);
      } else {
        // Pago simple
        const cashIn=S.selectedPay==='cash'?parseFloat(S.cashInput||0):null;
        if(S.selectedPay==='cash'&&cashIn<total)return;
        ticketData.method=S.selectedPay;
        ticketData.cashReceived=cashIn;
        ticketData.change=cashIn?cashIn-total:null;
        await recordSale(S.selectedPay,cashIn,discAmt);
      }
      // Mostrar modal de ticket (el toque en Imprimir preserva gesto de usuario)
      S.receiptData=ticketData;
      S.selectedPay='';S.cashInput='';S.appliedDiscount=null;S.splitPay=false;S.pay2='';S.pay1Amount='';
      S.modal='receipt';
      await navigateTo('pos');
      break;
      }finally{S._saving=false;_liloUnlockPayButtons();}
    }
    case 'print-ticket':
      if(S.receiptData)printTicket(S.receiptData);
      break;
    case 'close-modal':
      S.modal=null;S.editTarget=null;S.shiftSummary=null;
      await fullRender();break;
    case 'date-range':
      S.dateRange=range;
      if(range!=='custom'){S.customFrom='';S.customTo='';}
      await navigateTo('dashboard');break;
    case 'apply-day-range':{
      const dd=document.getElementById('dash-day');
      if(!dd?.value){alert('Selecciona un día.');return;}
      S.customDay=dd.value;S.dateRange='day';
      await navigateTo('dashboard');break;
    }
    case 'apply-custom-range':{
      const df=document.getElementById('dash-from');
      const dt=document.getElementById('dash-to');
      if(!df?.value||!dt?.value){alert('Selecciona ambas fechas.');return;}
      S.customFrom=df.value;S.customTo=dt.value;
      S.dateRange='custom';
      await navigateTo('dashboard');break;
    }
    case 'add-product':
      S.modal='product';S.editTarget=null;await fullRender();break;
    case 'add-product-brand':
      S.modal='product';S.editTarget={brand};await fullRender();break;
    case 'edit-product':{
      const prod=S.products.find(p=>p.id==id);
      S.modal='product';S.editTarget=prod||null;await fullRender();break;
    }
    case 'toggle-product':
    case 'delete-product':{
      if(!confirm('¿Eliminar este producto? Esta acción no se puede deshacer.'))return;
      await db.products.delete(id);
      S.products=await db.products.filter(p=>p.active===1).toArray();
      await navigateTo('products');break;
    }
    case 'delete-sale':{
      if(S.user?.role!=='owner')return;
      if(!confirm('¿Eliminar esta venta del historial? El inventario no se revertirá.'))return;
      await db.sales.delete(id);
      await db.sale_items.where('sale_id').equals(id).delete();
      await navigateTo('history');break;
    }
    case 'save-product':{
      const name=document.getElementById('prod-name')?.value?.trim();
      const price=parseFloat(document.getElementById('prod-price')?.value);
      const brand2=document.getElementById('prod-brand')?.value;
      const stock=parseInt(document.getElementById('prod-stock')?.value)||0;
      const track=document.getElementById('prod-track')?.checked?1:0;
      if(!name||!price||!brand2){alert('Completa nombre, precio y marca');return;}
      if(S.editTarget?.id){
        await db.products.where('id').equals(S.editTarget.id).modify({name,price,brand:brand2,stock,track_stock:track});
      }else{
        await db.products.add({name,price,brand:brand2,stock,active:1,track_stock:track});
      }
      S.products=await db.products.filter(p=>p.active===1).toArray();
      S.modal=null;S.editTarget=null;await navigateTo('products');break;
    }
    case 'add-stock':{
      const prod=S.products.find(p=>p.id==id);
      S.modal='stock';S.editTarget=prod||null;await fullRender();break;
    }
    case 'save-stock':{
      const qty=parseInt(document.getElementById('stock-qty')?.value)||0;
      const cost=parseFloat(document.getElementById('stock-cost')?.value)||0;
      const notes=document.getElementById('stock-notes')?.value||'';
      if(!qty||qty<1){alert('Ingresa la cantidad');return;}
      await db.products.where('id').equals(S.editTarget.id).modify(p=>{p.stock+=qty;});
      await db.stock_log.add({product_id:S.editTarget.id,qty,cost,notes,date:Date.now(),type:'entry'});
      S.products=await db.products.filter(p=>p.active===1).toArray();
      S.modal=null;S.editTarget=null;await navigateTo('inventory');break;
    }
    case 'add-user':
      S.modal='user';S.editTarget=null;await fullRender();break;
    case 'edit-user':{
      const usr=S.users.find(u=>u.id==id);
      S.modal='user';S.editTarget=usr||null;await fullRender();break;
    }
    case 'delete-user':{
      if(!confirm('¿Eliminar este usuario?'))return;
      await db.users.delete(id);
      S.users=await db.users.toArray();await navigateTo('users');break;
    }
    case 'save-user':{
      const name=document.getElementById('user-name')?.value?.trim();
      const role=document.getElementById('user-role')?.value;
      const pin=document.getElementById('user-pin')?.value;
      const baff=document.getElementById('user-brand')?.value||null;
      if(!name||!pin||pin.length!==4||!/^\d{4}$/.test(pin)){alert('Nombre requerido y PIN debe ser exactamente 4 números');return;}
      if(S.editTarget?.id){
        await db.users.where('id').equals(S.editTarget.id).modify({name,role,pin,brand_affiliation:baff});
      }else{
        await db.users.add({name,role,pin,brand_affiliation:baff});
      }
      S.users=await db.users.toArray();
      S.modal=null;S.editTarget=null;await navigateTo('users');break;
    }
    case 'confirm-close-shift':{
      const cc=parseFloat(document.getElementById('cash-close-input')?.value||'0')||0;
      S.cashClose=cc;
      const summary=await closeShift();
      summary.cashClose=cc;
      S.shiftSummary=summary;S.modal='shift-done';await fullRender();break;
    }
    case 'toggle-shift':
      S.expandedShift=S.expandedShift===id?null:id;
      await navigateTo('history');break;
    case 'history-apply-date':{
      const di=document.getElementById('hist-date-input');
      S.historyDate=di?.value||'';
      S.expandedShift=null;
      await navigateTo('history');break;
    }
    case 'history-clear-date':
      S.historyDate='';S.expandedShift=null;
      await navigateTo('history');break;
    case 'confirm-open-corte':{
      const fondo=parseFloat(document.getElementById('fondo-input')?.value||'0')||0;
      S.cashClose=0;
      await openShift(fondo);
      S.view='pos';
      render(renderShell(renderPOS()));
      break;
    }
    case 'open-discount-picker':{
      S.discounts=await db.discounts.toArray();
      S.modal='discount-picker';
      await fullRender();break;
    }
    case 'apply-discount':{
      const disc=S.discounts.find(d=>d.id==id);
      if(disc){S.appliedDiscount={id:disc.id,name:disc.name,type:disc.type,value:disc.value};}
      S.modal=null;await navigateTo('pos');break;
    }
    /* ── MESAS ── */
    case 'open-abrir-mesa-modal':
      if(S.cart.length===0)return;
      S.mesaNombreTmp='';
      render(renderShell(renderPOS())+renderAbrirMesaModal());
      bindEvents();break;
    case 'sel-mesa-nombre':
      S.mesaNombreTmp=btn.dataset.nombre||'';
      {const inp=document.getElementById('mesa-nombre-input');if(inp)inp.value=S.mesaNombreTmp;}
      {document.querySelectorAll('.btn-mesa-nombre').forEach(b=>b.classList.toggle('active',b.dataset.nombre===S.mesaNombreTmp));}
      {const ob=document.querySelector('[data-action="confirmar-abrir-mesa"]');if(ob)ob.disabled=!S.mesaNombreTmp.trim();}
      break;
    case 'confirmar-abrir-mesa':{
      const nombre=(S.mesaNombreTmp||'').trim();
      if(!nombre){alert('Escribe un nombre para la mesa');return;}
      const yaExiste=S.mesasAbiertas.some(m=>m.nombre===nombre);
      if(yaExiste){alert('Ya hay una mesa con ese nombre. Elige otro.');return;}
      const mesaItems=S.cart.map(i=>({...i}));
      const mesaTotal=mesaItems.reduce((s,i)=>s+i.price*i.qty,0);
      await db.mesas.add({nombre,items:mesaItems,total:mesaTotal,abierta_at:Date.now(),status:'abierta',employee:S.user?.name||''});
      S.cart=[];S.appliedDiscount=null;S.mesaNombreTmp='';
      await navigateTo('mesas');
      break;
    }
    case 'ver-mesa':{
      const m=S.mesasAbiertas.find(x=>x.id==id);
      if(!m)return;
      S.mesaActiva={...m,items:JSON.parse(JSON.stringify(m.items||[]))};
      await navigateTo('mesa-detail');break;
    }
    case 'back-to-mesas':
      S.mesaActiva=null;S.mesaAgregarOpen=false;S.mesaSearch='';
      await navigateTo('mesas');break;
    case 'toggle-modo-eliminar':
      S.modoEliminarMesas=!S.modoEliminarMesas;
      S.mesasSeleccionadas=[];
      render(renderShell(renderMesas()));bindEvents();break;
    case 'toggle-sel-mesa':{
      const sel=S.mesasSeleccionadas||[];
      const idx=sel.indexOf(id);
      if(idx>=0)sel.splice(idx,1);else sel.push(id);
      S.mesasSeleccionadas=sel;
      render(renderShell(renderMesas()));bindEvents();break;
    }
    case 'eliminar-mesas-sel':{
      const sel=S.mesasSeleccionadas||[];
      if(sel.length===0)break;
      if(!confirm(`¿Eliminar ${sel.length} mesa(s) seleccionada(s)? No se puede deshacer.`))break;
      for(const mid of sel){
        try{await db.mesas.delete(mid);}catch(e){console.error('Error borrando mesa',mid,e);}
      }
      S.mesasAbiertas=S.mesasAbiertas.filter(m=>!sel.includes(m.id));
      S.mesasSeleccionadas=[];S.modoEliminarMesas=false;S.mesaActiva=null;
      await navigateTo('mesas');break;
    }
    case 'mesa-qty-inc':{
      if(!S.mesaActiva)return;
      if(!Array.isArray(S.mesaActiva.items))S.mesaActiva.items=[];
      const item=S.mesaActiva.items.find(i=>i.id==id);
      if(item){item.qty++;S.mesaActiva.total=S.mesaActiva.items.reduce((s,i2)=>s+i2.price*i2.qty,0);}
      try{await db.mesas.where('id').equals(S.mesaActiva.id).modify({items:S.mesaActiva.items,total:S.mesaActiva.total});}catch(e){console.error('Error mesa-qty-inc:',e);}
      render(renderShell(renderMesaDetalle()));bindEvents();break;
    }
    case 'mesa-qty-dec':{
      if(!S.mesaActiva)return;
      if(!Array.isArray(S.mesaActiva.items))S.mesaActiva.items=[];
      const idx=S.mesaActiva.items.findIndex(i=>i.id==id);
      if(idx>=0){
        S.mesaActiva.items[idx].qty--;
        if(S.mesaActiva.items[idx].qty<=0)S.mesaActiva.items.splice(idx,1);
        S.mesaActiva.total=S.mesaActiva.items.reduce((s,i2)=>s+i2.price*i2.qty,0);
      }
      try{await db.mesas.where('id').equals(S.mesaActiva.id).modify({items:S.mesaActiva.items,total:S.mesaActiva.total});}catch(e){console.error('Error mesa-qty-dec:',e);}
      render(renderShell(renderMesaDetalle()));bindEvents();break;
    }
    case 'open-mesa-agregar':
      S.mesaAgregarOpen=true;
      render(renderShell(renderMesaDetalle())+renderAgregarProductosMesaModal());
      bindEvents();break;
    case 'close-mesa-agregar':
      S.mesaSearch='';S.mesaAgregarOpen=false;
      render(renderShell(renderMesaDetalle()));
      bindEvents();break;
    case 'mesa-add-product':{
      if(!S.mesaActiva)return;
      const prod=S.products.find(p=>p.id==id);
      if(!prod)return;
      if(!Array.isArray(S.mesaActiva.items))S.mesaActiva.items=[];
      const ex=S.mesaActiva.items.find(i=>i.id==id);
      if(ex){ex.qty++;}else{S.mesaActiva.items.push({id:prod.id,name:prod.name,price:prod.price,brand:prod.brand||'',qty:1});}
      S.mesaActiva.total=S.mesaActiva.items.reduce((s,i)=>s+i.price*i.qty,0);
      try{await db.mesas.where('id').equals(S.mesaActiva.id).modify({items:S.mesaActiva.items,total:S.mesaActiva.total});}catch(e){console.error('Error guardando producto en mesa:',e);}
      // mantenemos modal abierto si está abierto
      render(renderShell(renderMesaDetalle())+(S.mesaAgregarOpen?renderAgregarProductosMesaModal():''));
      bindEvents();break;
    }
    case 'print-comanda':{
      let m=S.mesasAbiertas.find(x=>x.id==id);
      if(!m&&S.mesaActiva?.id==id)m=S.mesaActiva;
      if(m)await printComanda(m);break;
    }
    case 'print-cuenta':{
      let m=S.mesasAbiertas.find(x=>x.id==id);
      if(!m&&S.mesaActiva?.id==id)m=S.mesaActiva;
      if(m)await printCuenta(m);break;
    }
    case 'cobrar-mesa':{
      const m=S.mesasAbiertas.find(x=>x.id==id)||S.mesaActiva;
      if(!m)return;
      if(!S.shift){_liloNeedCorte();return;}
      S.mesaActiva={...m};
      S.selectedPay='';S.cashInput='';
      render(renderShell(renderMesaDetalle())+renderCobrarMesaModal());
      bindEvents();break;
    }
    case 'close-cobrar-mesa':
      S.selectedPay='';
      render(renderShell(S.mesaActiva?renderMesaDetalle():renderMesas()));
      bindEvents();break;
    case 'sel-pay-mesa':
      S.selectedPay=btn.dataset.pay||'';
      S.mesaPay2='';
      {const m=S.mesaActiva;render(renderShell(m?renderMesaDetalle():renderMesas())+renderCobrarMesaModal());bindEvents();}
      setTimeout(()=>{const el=document.getElementById('mesa-cash-input');if(el)el.focus();},60);break;
    case 'sel-pay2-mesa':
      S.mesaPay2=btn.dataset.pay||'';
      {const m=S.mesaActiva;render(renderShell(m?renderMesaDetalle():renderMesas())+renderCobrarMesaModal());bindEvents();}break;
    case 'toggle-split-pay-mesa':
      S.mesaSplitPay=!S.mesaSplitPay;
      S.mesaPay2='';S.mesaPay1Amount='';S.mesaCashInput='';
      {const m=S.mesaActiva;render(renderShell(m?renderMesaDetalle():renderMesas())+renderCobrarMesaModal());bindEvents();}break;
    case 'confirmar-cobrar-mesa':{
      if(S._saving)return;
      S._saving=true;_liloLockPayButtons();
      try{
      if(!S.selectedPay||!S.mesaActiva)return;
      try{const fresh=await db.mesas.get(S.mesaActiva.id);
        if(!fresh||fresh.status!=='abierta'){alert('Esta mesa ya fue cobrada o eliminada en otro dispositivo.');S.mesaActiva=null;S.modal=null;await navigateTo('mesas');return;}}catch(_){}
      const m=S.mesaActiva;
      const mesaTotal=(m.items||[]).reduce((s,i)=>s+i.price*i.qty,0);
      const prevCart=S.cart;
      S.cart=m.items.map(i=>({...i}));
      if(!S.shift){S.cart=prevCart;S.modal=null;_liloNeedCorte();return;}
      let mesaMethod,mesaCashIn=null,mesaChange=null,mesaPayDetails=null;
      if(S.mesaSplitPay&&S.mesaPay2){
        const p1Amt=parseFloat(S.mesaPay1Amount||0)||0;
        const p2Amt=Math.max(0,mesaTotal-p1Amt);
        mesaPayDetails={[S.selectedPay]:p1Amt,[S.mesaPay2]:p2Amt};
        mesaMethod='mixed';
        await recordSale('mixed',null,0,mesaPayDetails);
      } else {
        const cashIn=S.selectedPay==='cash'?parseFloat(document.getElementById('mesa-cash-input')?.value||S.mesaCashInput||'0')||0:null;
        if(S.selectedPay==='cash'&&cashIn<mesaTotal){alert('El efectivo recibido es menor al total.');S.cart=prevCart;return;}
        mesaMethod=S.selectedPay;mesaCashIn=cashIn;mesaChange=cashIn?cashIn-mesaTotal:null;
        await recordSale(S.selectedPay,cashIn,0);
      }
      // Close mesa in Firestore
      await db.mesas.where('id').equals(m.id).modify({status:'cerrada',cerrada_at:Date.now()});
      // Show receipt
      S.receiptData={items:m.items,subtotal:mesaTotal,discount:0,total:mesaTotal,timestamp:Date.now(),employee:S.user?.name||'',method:mesaMethod,cashReceived:mesaCashIn,change:mesaChange,payDetails:mesaPayDetails,mesaNombre:m.nombre};
      S.mesaActiva=null;S.selectedPay='';S.cashInput='';S.mesaSplitPay=false;S.mesaPay2='';S.mesaPay1Amount='';S.mesaCashInput='';
      S.cart=prevCart;
      S.modal='receipt';
      await navigateTo('mesas');break;
      }finally{S._saving=false;_liloUnlockPayButtons();}
    }
    /* ── END MESAS ── */
    case 'apply-custom-discount':{
      const type=document.getElementById('custom-disc-type')?.value||'percent';
      const val=parseFloat(document.getElementById('custom-disc-val')?.value)||0;
      if(val>0){S.appliedDiscount={id:null,name:type==='percent'?val+'% personalizado':'$'+val+' personalizado',type,value:val};}
      S.modal=null;await navigateTo('pos');break;
    }
    case 'remove-discount':
      S.appliedDiscount=null;S.modal=null;await navigateTo('pos');break;
    case 'add-discount':
      S.modal='discount';S.editTarget=null;await fullRender();break;
    case 'edit-discount':{
      const discs=await db.discounts.toArray();
      S.modal='discount';S.editTarget=discs.find(d=>d.id==id)||null;await fullRender();break;
    }
    case 'delete-discount':{
      if(!confirm('¿Eliminar este descuento?'))return;
      await db.discounts.delete(id);
      await navigateTo('discounts');break;
    }
    case 'save-discount':{
      const name=document.getElementById('disc-name')?.value?.trim();
      const type=document.getElementById('disc-type')?.value;
      const value=parseFloat(document.getElementById('disc-value')?.value)||0;
      if(!name||!value){alert('Completa nombre y valor');return;}
      if(S.editTarget?.id){
        await db.discounts.where('id').equals(S.editTarget.id).modify({name,type,value,active:1});
      }else{
        await db.discounts.add({name,type,value,active:1});
      }
      S.discounts=await db.discounts.toArray();
      S.modal=null;S.editTarget=null;await navigateTo('discounts');break;
    }
  }
}

function handleInput(e){
  if(e.target.dataset.action==='mesa-nombre-input'){
    S.mesaNombreTmp=e.target.value;
    document.querySelectorAll('.btn-mesa-nombre').forEach(b=>b.classList.toggle('active',b.dataset.nombre===S.mesaNombreTmp));
    const ob=document.querySelector('[data-action="confirmar-abrir-mesa"]');
    if(ob)ob.disabled=!S.mesaNombreTmp.trim();
    return;
  }
  if(e.target.dataset.action==='mesa-search'){
    S.mesaSearch=e.target.value;
    const q=(S.mesaSearch||'').toLowerCase();
    const m=S.mesaActiva;
    let filtered=S.brandFilter==='all'?S.products:S.products.filter(p=>p.brand===S.brandFilter);
    if(q)filtered=filtered.filter(p=>p.name.toLowerCase().includes(q));
    const grid=document.querySelector('.product-grid');
    if(grid){
      grid.innerHTML=filtered.length===0
        ?`<div style="grid-column:1/-1;text-align:center;padding:30px;color:var(--t3);">Sin resultados</div>`
        :filtered.map(p=>{
          const out=p.track_stock&&p.stock===0;
          const b=BRANDS[p.brand];
          const inMesa=m?(m.items||[]).find(i=>i.id===p.id):null;
          return`<button class="product-card ${b?.cls||''}${out?' out':''}"
            data-action="mesa-add-product" data-id="${p.id}"${out?' disabled':''}
            style="position:relative;">
            ${inMesa?`<span style="position:absolute;top:4px;right:4px;background:var(--accent);color:#fff;font-size:10px;font-weight:700;border-radius:999px;padding:1px 5px;">${inMesa.qty}</span>`:''}
            <span class="p-name">${esc(p.name)}</span>
            <span class="p-price">${fmt(p.price)}</span>
          </button>`;
        }).join('');
    }
    return;
  }
  if(e.target.dataset.action==='search-products'){
    S.searchQuery=e.target.value;
    const q=S.searchQuery.toLowerCase();
    let filtered=S.brandFilter==='all'?S.products:S.products.filter(p=>p.brand===S.brandFilter);
    if(q)filtered=filtered.filter(p=>p.name.toLowerCase().includes(q));
    const grid=document.querySelector('.product-grid');
    if(grid)grid.innerHTML=filtered.length===0?`<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon">🔍</div><div class="empty-text">Sin resultados</div></div>`:renderProductCards(filtered);
    return;
  }
  if(e.target.dataset.action==='pay1-amount-input'){
    S.pay1Amount=e.target.value;
    const subtotal=S.cart.reduce((s,i)=>s+i.price*i.qty,0);
    const total=subtotal-calcDiscount(subtotal);
    const p1=parseFloat(S.pay1Amount||0)||0;
    const p2=Math.max(0,total-p1);
    const confirmBtn=document.querySelector('[data-action="confirm-sale"]');
    if(confirmBtn){
      if(p1>0&&p1<total&&S.pay2)confirmBtn.removeAttribute('disabled');
      else confirmBtn.setAttribute('disabled','');
    }
    // Update remainder display
    const restEl=document.querySelector('[data-rem]');
    if(restEl)restEl.textContent=fmt(p2);
    return;
  }
  if(e.target.dataset.action==='mesa-cash-input'){
    S.mesaCashInput=e.target.value;
    const m=S.mesaActiva;if(!m)return;
    const mesaTotal=(m.items||[]).reduce((s,i)=>s+i.price*i.qty,0);
    const cashIn=parseFloat(S.mesaCashInput||0)||0;
    const confirmBtn=document.querySelector('[data-action="confirmar-cobrar-mesa"]');
    if(confirmBtn){if(cashIn>=mesaTotal)confirmBtn.removeAttribute('disabled');else confirmBtn.setAttribute('disabled','');}
    const cs=document.querySelector('.cash-section');
    if(cs){
      let chEl=cs.querySelector('.change-row'),wEl=cs.querySelector('.warn-row');
      if(cashIn>=mesaTotal&&cashIn>0){
        if(!chEl){chEl=document.createElement('div');chEl.className='change-row';cs.appendChild(chEl);}
        if(wEl)wEl.remove();
        chEl.innerHTML=`<span class="change-label">Cambio</span><span class="change-amount">${fmt(cashIn-mesaTotal)}</span>`;
      } else if(cashIn>0){
        if(chEl)chEl.remove();
        if(!wEl){wEl=document.createElement('div');wEl.className='warn-row';wEl.style.cssText='color:var(--danger);font-size:12px;margin-top:6px;';cs.appendChild(wEl);}
        wEl.textContent=`Faltan ${fmt(mesaTotal-cashIn)}`;
      } else {if(chEl)chEl.remove();if(wEl)wEl.remove();}
    }
    return;
  }
  if(e.target.dataset.action==='mesa-pay1-amount-input'){
    S.mesaPay1Amount=e.target.value;
    const m=S.mesaActiva;if(!m)return;
    const mesaTotal=(m.items||[]).reduce((s,i)=>s+i.price*i.qty,0);
    const p1=parseFloat(S.mesaPay1Amount||0)||0;
    const p2=Math.max(0,mesaTotal-p1);
    const confirmBtn=document.querySelector('[data-action="confirmar-cobrar-mesa"]');
    if(confirmBtn){if(p1>0&&p1<mesaTotal&&S.mesaPay2)confirmBtn.removeAttribute('disabled');else confirmBtn.setAttribute('disabled','');}
    const remEl=document.querySelector('[data-mesa-rem]');
    if(remEl)remEl.textContent=fmt(p2);
    return;
  }
  if(e.target.dataset.action==='cash-input'){
    S.cashInput=e.target.value;
    const total=S.cart.reduce((s,i)=>s+i.price*i.qty,0);
    const cashIn=parseFloat(S.cashInput||0)||0;
    const confirmBtn=document.querySelector('[data-action="confirm-sale"]');
    if(confirmBtn){
      if(cashIn>=total)confirmBtn.removeAttribute('disabled');
      else confirmBtn.setAttribute('disabled','');
    }
    // Update change display
    const cashSection=document.querySelector('.cash-section');
    if(cashSection){
      let changeEl=cashSection.querySelector('.change-row');
      let warnEl=cashSection.querySelector('.warn-row');
      if(cashIn>=total&&cashIn>0){
        if(!changeEl){
          changeEl=document.createElement('div');
          changeEl.className='change-row';
          cashSection.appendChild(changeEl);
        }
        if(warnEl)warnEl.remove();
        changeEl.innerHTML=`<span class="change-label">Cambio</span><span class="change-amount">${fmt(cashIn-total)}</span>`;
      } else if(cashIn>0){
        if(changeEl)changeEl.remove();
        if(!warnEl){
          warnEl=document.createElement('div');
          warnEl.className='warn-row';
          warnEl.style.cssText='color:var(--danger);font-size:12px;margin-top:6px;';
          cashSection.appendChild(warnEl);
        }
        warnEl.textContent=`Faltan ${fmt(total-cashIn)}`;
      } else {
        if(changeEl)changeEl.remove();
        if(warnEl)warnEl.remove();
      }
    }
  }
}

/* ══════════════════════════════════════════════
   REAL-TIME SYNC
══════════════════════════════════════════════ */
function setupRealtimeListeners(){
  if(window._liloUnsubs)window._liloUnsubs.forEach(u=>u());
  window._liloUnsubs=[];
  window._liloUnsubs.push(
    _fs.collection('products').onSnapshot(snap=>{
      const fresh=snap.docs.map(d=>({...d.data(),id:d.id}));
      S.products=['inventory','products'].includes(S.view)?fresh:fresh.filter(p=>p.active===1);
      if(S.user&&['pos','inventory','products'].includes(S.view))fullRender();
    }),
    _fs.collection('users').onSnapshot(snap=>{
      S.users=snap.docs.map(d=>({...d.data(),id:d.id}));
      if(S.user&&S.view==='users')fullRender();
    }),
    _fs.collection('discounts').onSnapshot(snap=>{
      S.discounts=snap.docs.map(d=>({...d.data(),id:d.id}));
      if(S.user&&S.view==='discounts')fullRender();
    }),
    _fs.collection('mesas').where('status','==','abierta').onSnapshot(snap=>{
      S.mesasAbiertas=snap.docs.map(d=>({...d.data(),id:d.id}));
      // Update active mesa if it changed
      if(S.mesaActiva){
        const updated=S.mesasAbiertas.find(m=>m.id===S.mesaActiva.id);
        if(updated)S.mesaActiva={...updated};
      }
      if(S.user){
        // Always re-render sidebar badge + current view if on mesas
        if(['mesas','mesa-detail'].includes(S.view))fullRender();
        else{
          // Just update badge in sidebar without full re-render
          document.querySelectorAll('.mesa-badge').forEach(el=>el.textContent=S.mesasAbiertas.length||0);
          const sidebarBadge=document.querySelector('[data-view="mesas"] .mesa-badge');
          if(S.mesasAbiertas.length>0){
            if(!sidebarBadge){const btn=document.querySelector('[data-view="mesas"]');if(btn){const sp=document.createElement('span');sp.className='mesa-badge';sp.textContent=S.mesasAbiertas.length;btn.appendChild(sp);}}
            else{sidebarBadge.textContent=S.mesasAbiertas.length;}
          } else {if(sidebarBadge)sidebarBadge.remove();}
        }
      }
    })
  );
}

/* ── Corte automático a medianoche ── */
let _midnightTimer=null;
function scheduleMidnightCorte(){
  if(_midnightTimer)clearTimeout(_midnightTimer);
  const now=new Date();
  const midnight=new Date(now);
  midnight.setHours(24,0,0,0); // siguiente medianoche
  const ms=midnight.getTime()-now.getTime();
  _midnightTimer=setTimeout(async()=>{
    if(S.shift&&S.shift.status==='open'){
      try{
        const summary=await closeShift();
        S.shiftSummary=summary;
        S.modal='shift-done';
        await fullRender();
      }catch(e){console.warn('Auto-corte medianoche error:',e);}
    }
    await _liloAutoCloseStale();
    scheduleMidnightCorte(); // reagendar para siguiente medianoche
  },ms);
}

/* ── Mantener sesión al minimizar / reabrir ── */
const LILO_SESSION_KEY='lilo_session';
const LILO_SESSION_MAX=12*3600000; // 12 horas sin usar la app
function _liloSaveSession(){try{if(S.user)localStorage.setItem(LILO_SESSION_KEY,JSON.stringify({uid:S.user.id,view:S.view,t:Date.now()}));}catch(_){}}
function _liloClearSession(){try{localStorage.removeItem(LILO_SESSION_KEY);}catch(_){}}
function _liloReadSession(){try{const v=JSON.parse(localStorage.getItem(LILO_SESSION_KEY)||'null');if(v&&v.uid&&Date.now()-(v.t||0)<LILO_SESSION_MAX)return v;}catch(_){}return null;}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){_liloSaveSession();_liloSaveCart();}});
window.addEventListener('pagehide',_liloSaveSession);

async function doLogin(user){
  S.user=user;S.loginUser=null;S.pinBuffer='';
  S.products=await db.products.filter(p=>p.active===1).toArray();
  S.users=await db.users.toArray();
  S.discounts=await db.discounts.toArray();
  await _liloAutoCloseStale();
  const open=await db.shifts.where('employee_id').equals(user.id).filter(s=>s.status==='open').toArray();
  S.shift=open.length>0?open[open.length-1]:null;
  setupRealtimeListeners();
  _liloLoadPopularity();
  scheduleMidnightCorte(); // iniciar temporizador de corte automático
  if(S.shift||user.role==='owner'){
    S.view='pos';
    render(renderShell(renderPOS()));
  } else {
    S.view='abrir-corte';
    render(renderShell(renderAbrirCorte()));
  }
  _liloSaveSession();
}

async function getViewHtml(){
  switch(S.view){
    case 'pos':          return renderPOS();
    case 'dashboard':    return renderDashboard();
    case 'inventory':    return renderInventory();
    case 'products':     return renderProducts();
    case 'discounts':    return await renderDiscounts();
    case 'users':        return renderUsers();
    case 'history':      return await renderHistory();
    case 'gastos':       return await renderGastos();
    case 'shift-close':  return await renderShiftClose();
    case 'abrir-corte':  return renderAbrirCorte();
    case 'mesas':        return renderMesas();
    case 'mesa-detail':  return renderMesaDetalle();
    default:             return renderPOS();
  }
}

async function navigateTo(view){
  S.view=view;
  if(S.user)_liloSaveSession();
  if(view!=='pos')S.searchQuery='';
  // close mobile sidebar before re-render
  document.querySelector('.sidebar-backdrop')?.classList.remove('mob-open');
  // (no Chart.js instances to destroy — charts are inline SVG)
  if(['inventory','products'].includes(view))S.products=await db.products.toArray();
  if(view==='pos')S.products=await db.products.filter(p=>p.active===1).toArray();
  if(view==='users'||view==='history'||view==='pos')S.users=await db.users.toArray();
  if(view==='dashboard'){
    S.dashData=null;
    render(renderShell(renderDashboard()));
    S.dashData=await loadDashboardData();
  }
  const v=await getViewHtml();
  const m=S.modal?`<div class="modal-overlay" id="modal-overlay">${renderModal()}</div>`:'';
  render(renderShell(v)+m);
  // charts are now inline SVG, no initCharts needed
}

/* ══════════════════════════════════════════════
   SVG CHARTS (inline, no external library)
══════════════════════════════════════════════ */
function svgBarChart(data){
  const{labels,aa,cr,li}=data;
  if(!labels||labels.length===0)return'<div style="display:flex;align-items:center;justify-content:center;height:200px;color:var(--t3);font-size:13px;">Sin ventas en este período</div>';
  const W=420,H=220,padL=46,padR=8,padT=8,padB=52;
  const cW=W-padL-padR,cH=H-padT-padB;
  const totals=labels.map((_,i)=>(aa[i]||0)+(cr[i]||0)+(li[i]||0));
  const maxV=Math.max(...totals,1);
  const n=labels.length;
  const bW=Math.max(4,Math.min(36,Math.floor(cW/n*0.65)));
  const spacing=(cW-bW*n)/(n+1);
  let yLines='',yLbls='';
  for(let t=0;t<=4;t++){
    const val=maxV*t/4;
    const y=padT+cH-(cH*t/4);
    yLines+=`<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="rgba(42,31,26,.07)" stroke-width="1"/>`;
    const lbl=val===0?'0':val>=1000?'$'+(val/1000).toFixed(val%1000===0?0:1)+'k':'$'+Math.round(val);
    yLbls+=`<text x="${padL-4}" y="${(y+3.5).toFixed(1)}" text-anchor="end" font-size="9" fill="#B09A94">${lbl}</text>`;
  }
  let bars='',xLbls='';
  const showEvery=n<=12?1:Math.ceil(n/12);
  labels.forEach((lbl,i)=>{
    const bx=padL+spacing+i*(bW+spacing);
    let yBot=padT+cH;
    [[aa[i]||0,'rgba(194,24,91,.75)'],[cr[i]||0,'rgba(212,81,28,.75)'],[li[i]||0,'rgba(232,184,75,.85)']].forEach(([v,col])=>{
      if(v>0){const bh=Math.max(2,cH*v/maxV);yBot-=bh;bars+=`<rect x="${bx.toFixed(1)}" y="${yBot.toFixed(1)}" width="${bW}" height="${bh.toFixed(1)}" fill="${col}" rx="2"/>`;}
    });
    if(i%showEvery===0||i===n-1)xLbls+=`<text x="${(bx+bW/2).toFixed(1)}" y="${padT+cH+13}" text-anchor="middle" font-size="${n>10?8:10}" fill="#B09A94">${String(lbl).replace(/&/g,'&amp;')}</text>`;
  });
  const legY=H-18;
  const legend=`<rect x="${padL}" y="${legY}" width="8" height="8" fill="rgba(232,184,75,.85)" rx="1"/><text x="${padL+11}" y="${legY+7}" font-size="9" fill="#7A6560">LILO</text><rect x="${padL+45}" y="${legY}" width="8" height="8" fill="rgba(212,81,28,.75)" rx="1"/><text x="${padL+56}" y="${legY+7}" font-size="9" fill="#7A6560">Crepa Roll</text><rect x="${padL+112}" y="${legY}" width="8" height="8" fill="rgba(194,24,91,.75)" rx="1"/><text x="${padL+123}" y="${legY+7}" font-size="9" fill="#7A6560">Amor Azúcar</text>`;
  return`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:210px;display:block;" xmlns="http://www.w3.org/2000/svg">${yLines}${yLbls}${bars}${xLbls}${legend}</svg>`;
}

const PAY_COLOR={cash:'#43A047',card:'#E8B84B',transfer:'#D81B60'};
function svgDonutChart(payTotals){
  const keys=['cash','card','transfer'];
  const total=keys.reduce((t,k)=>t+(payTotals[k]||0),0);
  const head=`<div style="text-align:center;margin:2px 0 10px;"><div style="font-size:12px;color:var(--t2);">Total cobrado</div><div style="font-size:26px;font-weight:800;color:var(--t1);line-height:1.2;">${fmt(total)}</div></div>`;
  if(total===0)return head+`<div style="text-align:center;padding:30px 0;color:var(--t3);font-size:14px;">Sin ventas en este período</div>`;
  const S2=220,c=S2/2,R=104;
  let paths='',labels='',a0=-Math.PI/2;
  const segs=keys.filter(k=>(payTotals[k]||0)>0).map(k=>({k,val:payTotals[k]}));
  segs.forEach(sg=>{
    const frac=sg.val/total,a=frac*2*Math.PI,a1=a0+a;
    if(segs.length===1){paths+=`<circle cx="${c}" cy="${c}" r="${R}" fill="${PAY_COLOR[sg.k]}"/>`;}
    else{
      const x1=c+R*Math.cos(a0),y1=c+R*Math.sin(a0),x2=c+R*Math.cos(a1),y2=c+R*Math.sin(a1);
      paths+=`<path d="M${c},${c} L${x1.toFixed(2)},${y1.toFixed(2)} A${R},${R} 0 ${a>Math.PI?1:0},1 ${x2.toFixed(2)},${y2.toFixed(2)} Z" fill="${PAY_COLOR[sg.k]}" stroke="var(--surface)" stroke-width="3"/>`;
    }
    const pct=Math.round(frac*100);
    if(pct>=6){
      const mid=a0+a/2,lr=segs.length===1?0:R*0.6;
      const lx=c+lr*Math.cos(mid),ly=c+lr*Math.sin(mid);
      labels+=`<text x="${lx.toFixed(1)}" y="${(ly+9).toFixed(1)}" text-anchor="middle" font-size="${pct>=15?28:20}" font-weight="800" fill="#fff" stroke="rgba(0,0,0,.35)" stroke-width="3" paint-order="stroke" style="font-family:var(--font);">${pct}%</text>`;
    }
    a0=a1;
  });
  return head+`<svg viewBox="0 0 ${S2} ${S2}" style="width:100%;max-width:180px;height:auto;display:block;margin:0 auto;" xmlns="http://www.w3.org/2000/svg">${paths}${labels}</svg>`;
}

/* ══════════════════════════════════════════════
   INIT
══════════════════════════════════════════════ */
async function init(){
  await seedIfEmpty();
  S.users=await db.users.toArray();
  const sess=_liloReadSession();
  const su=sess&&S.users.find(u=>String(u.id)===String(sess.uid));
  if(su){
    try{
      await doLogin(su);
      _liloRestoreCart();
      if(S.cart.length&&S.view==='pos')render(renderShell(renderPOS()));
      const okViews=['pos','mesas','dashboard','inventory','products','discounts','users','gastos','history','shift-close'];
      const adminOnly=['dashboard','inventory','products','discounts','users','gastos','history'];
      if(sess.view&&sess.view!==S.view&&okViews.includes(sess.view)&&(su.role==='owner'||!adminOnly.includes(sess.view))&&!(S.view==='abrir-corte'&&sess.view==='pos'))
        await navigateTo(sess.view);
      return;
    }catch(e){console.warn('No se pudo restaurar la sesión',e);_liloClearSession();}
  }
  S.splash=true;
  render(renderLogin());
  setTimeout(()=>{
    S.splash=false;
    if(!S.user&&!S.loginUser){S.splashDone=true;render(renderLogin());setTimeout(()=>{S.splashDone=false;},600);}
  },2000);
  _liloAutoCloseStale();
  scheduleMidnightCorte();
}
window.addEventListener('DOMContentLoaded',init);
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();window._liloInstallEvt=e;
  if(!S.user)render(renderLogin());
});
window.addEventListener('appinstalled',()=>{window._liloInstallEvt=null;if(!S.user)render(renderLogin());});
window._liloInstall=async function(){
  const e=window._liloInstallEvt;if(!e)return;
  e.prompt();try{await e.userChoice;}catch(_){}
  window._liloInstallEvt=null;if(!S.user)render(renderLogin());
};
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(()=>{});
  });
}
